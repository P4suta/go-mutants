# SPDX-License-Identifier: MIT OR Apache-2.0

---
version: 2
project_name: go-mutants

builds:
  - id: go-mutants
    main: ./cmd/go-mutants
    binary: go-mutants
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - >-
        -s -w
        -X github.com/P4suta/go-mutants/internal/cli.Version={{ .Version }}

archives:
  - id: go-mutants
    ids: [go-mutants]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE-MIT
      - LICENSE-APACHE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^build:"

release:
  github:
    owner: P4suta
    name: go-mutants
  mode: keep-existing
  prerelease: true
  replace_existing_artifacts: true
