# The dotfiles-managed global mise configuration intentionally contains no
# language runtimes, so the Go toolchain and every quality gate are pinned
# here. CI installs exactly this list, which is why a green `mise run check`
# locally and a green CI job mean the same thing.
[tools]
go = "1.26.5"
golangci-lint = "2.12.2"
goreleaser = "2.17.1"
lefthook = "2.1.10"
just = "1.57.0"
actionlint = "1.7.12"
typos = "1.48.0"
taplo = "0.10.0"
committed = "1.1.11"
gitleaks = "8.30.1"
yamllint = "1.38.0"
rumdl = "0.2.43"

[tasks.bootstrap]
description = "Install the pinned toolchain, download modules, and install hooks"
run = ["mise install", "go mod download", "lefthook install"]

[tasks.build]
description = "Build every package and run the vet gate"
run = ["go build ./...", "go vet ./..."]

[tasks.test]
description = "Run the unit test suite"
run = "go test ./..."

[tasks.test-integration]
# The engine's integration suite alone runs 8-10 minutes of real toolchain
# work; Go's default per-package 10m alarm fires under load, so the budget
# is stated explicitly.
description = "Run the toolchain-backed integration suite"
run = "go test -tags integration -timeout 40m ./..."

[tasks.fmt]
# `gofmt -l` exits 0 even when it lists files, so the offenders have to be
# turned into a non-zero exit explicitly on both shells.
description = "Check Go and TOML formatting without rewriting any file"
run = [
  'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }',
  "taplo fmt --check",
]
run_windows = [
  'pwsh -NoLogo -NoProfile -Command "$f = gofmt -l .; if ($f) { $f; exit 1 }"',
  "taplo fmt --check",
]

[tasks.lint]
description = "Run the Go, spelling, TOML, workflow, YAML, secret, and doc linters"
run = [
  "golangci-lint run",
  "typos",
  "taplo check mise.toml .go-mutants.toml .typos.toml REUSE.toml committed.toml",
  "actionlint",
  "yamllint .github lefthook.yml .golangci.yml",
  "gitleaks dir . --no-banner --redact --verbose",
  "rumdl check .",
]

[tasks.check]
description = "Run every local gate that CI runs, in CI order"
run = ["mise run fmt", "mise run build", "mise run test", "mise run lint"]

[tasks.dogfood]
# Phase 12 replaces this with `go-mutants run --include internal/... --strict`
# against this repository; until the engine exists there is nothing to run.
description = "Mutation-test this repository with itself (placeholder for now)"
run = 'echo "dogfood arrives in a later phase"'
run_windows = "echo dogfood arrives in a later phase"

[tasks.package]
# Phase 12 replaces this with a real `goreleaser release --snapshot --clean`
# once the CLI produces installable artifacts.
description = "Build unpublished snapshot artifacts (goreleaser placeholder)"
run = 'echo "packaging arrives in a later phase"'
run_windows = "echo packaging arrives in a later phase"

[tasks.hooks]
description = "Install the git pre-commit and commit-msg hooks"
run = "lefthook install"
