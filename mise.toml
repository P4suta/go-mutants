# The dotfiles-managed global mise configuration intentionally contains no
# language runtimes, so the Go toolchain and every quality gate are pinned
# here. CI installs exactly this list, which is why a green `mise run check`
# locally and a green CI job mean the same thing.
[tools]
go = "1.26.6"
golangci-lint = "2.12.2"
goreleaser = "2.17.1"
lefthook = "2.1.10"
just = "1.57.0"
actionlint = "1.7.12"
typos = "1.48.0"
taplo = "0.10.0"
committed = "1.1.11"
gitleaks = "8.30.1"
yamllint = "1.38.0"
rumdl = "0.2.43"

[tasks.bootstrap]
description = "Install the pinned toolchain, download modules, and install hooks"
run = ["mise install", "go mod download", "lefthook install"]

[tasks.build]
description = "Build every package and run the vet gate"
run = ["go build ./...", "go vet ./..."]

[tasks.test]
# Deliberately not wrapped in `testcache exec`: this task compiles go-mutants
# itself, and that belongs in the developer's own build cache like every other
# `go test` they run. The suites' *child* `go` commands still go to the test
# cache, because internal/testkit points GOCACHE there in every environment it
# composes -- which is where the bloat came from in the first place.
description = "Run the unit test suite"
run = "go test ./..."

[tasks.test-integration]
# The engine's integration suite alone runs 8-10 minutes of real toolchain
# work; Go's default per-package 10m alarm fires under load, so the budget
# is stated explicitly.
#
# The `testcache exec` wrapper is what keeps this suite's rubble out of
# ~/.cache/go-build. It exports GOCACHE and GO_MUTANTS_TEST_GOCACHE into the
# child -- the first for every `go` command below it, the second so that a test
# composing a hermetic environment of its own resolves the same directory
# instead of falling back to the default -- prints the size and the growth to
# stderr when the suite ends, and exits with the suite's own status, so the gate
# is exactly as strict as it was without it. (`go run` reports any non-zero
# status as 1, as it does for every other `go run` task here, so what reaches
# mise is "the suite failed" rather than the suite's exact code.)
#
# Why one persistent dedicated cache rather than either obvious alternative:
#
#   not the user's cache  The suites drive thousands of child `go build`,
#                         `go test -c` and `go list` commands against fixtures,
#                         synthesized modules and instrumented snapshots, each
#                         living at an absolute path that exists for a single
#                         run -- so every entry is keyed on a path nothing will
#                         ever look up again. That took ~/.cache/go-build to
#                         14 GB and filled the disk twice.
#   not a cache per test  A GOCACHE under t.TempDir() is hermetic and
#                         recompiles the standard library once per test binary,
#                         which is minutes per package.
#
# --budget 4GiB is the ceiling that makes the persistent directory safe to keep:
# the cache is emptied *after* a run, and only when it is over the budget, so
# the run that paid to fill it is the run that benefits from it and no machine
# grows an unbounded one. `mise run test-cache-status` says where it is and how
# big it is; `mise run test-clean` empties it.
description = "Run the toolchain-backed integration suite"
run = "go run ./internal/devtools/testcache exec --budget 4GiB -- go test -tags integration -timeout 40m ./..."

[tasks.test-cache-status]
# The last line of a long run, and the first thing to look at when a disk fills.
# It prints both directories the harness owns outside a temporary directory: the
# shared build cache, and the root a kept-on-failure scratch directory is filed
# under. Both are named by GO_MUTANTS_TEST_GOCACHE and GO_MUTANTS_TEST_KEEP_DIR
# when those are set, and both live under <os.UserCacheDir()>/go-mutants-test
# otherwise, so a developer who wants everything this harness ever wrote can
# delete that one parent.
description = "Print where the test-owned build cache is and how much it holds"
run = "go run ./internal/devtools/testcache status"

[tasks.test-clean]
# `go clean -cache` against the test-owned GOCACHE, then a removal of whatever
# the go command leaves behind, then the kept scratch root. The go command's own
# eviction runs first because it takes the cache's lock, so a `go build`
# finishing in another terminal sees an emptied cache rather than a tree being
# deleted underneath it.
#
# Two things can stop a directory being emptied, and they end this task
# differently on purpose:
#
#   refused, exit 1   The directory does not carry the harness's marker file, so
#                     it is not emptied at all -- not even partly, and
#                     `go clean -cache` is not run against it either.
#                     `GO_MUTANTS_TEST_GOCACHE=$HOME` is an absolute path like
#                     any other, so ownership is a file rather than a promise:
#                     the harness writes it when a test resolves the cache, and
#                     this task reports and fails rather than deleting something
#                     it cannot show it made. `mise run test-cache-status` says
#                     which directories are stamped.
#   unfinished, exit 0  A file the removal could not unlink -- an antivirus
#                     scanner, a test binary Windows has not finished unmapping
#                     -- is retried once, then reported, and the task still
#                     succeeds. A collector that fails a run because a directory
#                     it wanted to delete is still there has done more damage
#                     than the directory ever would.
#
# So a non-zero exit from this task means "I was pointed at something that is
# not mine", and never "the disk was busy". Both cases print what happened.
description = "Empty the test-owned build cache and the kept scratch root"
run = "go run ./internal/devtools/testcache clean"

[tasks.golden-update]
# Rewrite every committed golden file, then read the diff before committing it.
#
# The packages are named one by one rather than with `./...`, and that list is
# the whole point of the task. There is one `-update` flag in this repository —
# it is registered in internal/testkit, so it is the same flag in every test
# binary that links the harness — and `go test -update ./...` would therefore
# regenerate every golden in the tree in one command, including the ones nobody
# was looking at. A golden regenerated without being read is a golden that
# records a bug.
#
# internal/testkit/golden_test.go::TestGoldenPackagesAreNamedByTheUpdateTask
# parses this line and fails when a package holding a `testdata/*.golden*` file
# is missing from it, so the list cannot go stale in silence.
#
# The packages come *before* `-update`, which is not a style choice. cmd/go
# knows its own test flags and nothing else; on an unrecognised one it stops
# parsing and hands the rest of the command line to the test binary, so
# `go test -update ./internal/report` runs the package in the working directory
# with two arguments it ignores — silently, and with every golden left alone.
description = "Rewrite the committed golden files, to be read before committing"
run = "go test ./internal/instrument ./internal/report ./trace -update"

[tasks.fmt]
# `gofmt -l` exits 0 even when it lists files, so the offenders have to be
# turned into a non-zero exit explicitly on both shells.
description = "Check Go and TOML formatting without rewriting any file"
run = [
  'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }',
  "taplo fmt --check",
]
run_windows = [
  'pwsh -NoLogo -NoProfile -Command "$f = gofmt -l .; if ($f) { $f; exit 1 }"',
  "taplo fmt --check",
]

[tasks.lint]
description = "Run the Go, spelling, TOML, workflow, YAML, secret, and doc linters"
run = [
  "golangci-lint run",
  "typos",
  "taplo check mise.toml .go-mutants.toml .typos.toml REUSE.toml committed.toml .rumdl.toml",
  "actionlint",
  "yamllint .github lefthook.yml .golangci.yml",
  "gitleaks dir . --no-banner --redact --verbose",
  "rumdl check .",
]

[tasks.check]
description = "Run every local gate that CI runs, in CI order"
run = ["mise run fmt", "mise run build", "mise run test", "mise run lint"]

[tasks.dogfood]
# go-mutants against go-mutants. The scope, the measured score and the floor
# all live in .go-mutants.toml, next to the settings they justify; only the two
# things that cannot be expressed in that file live here.
#
# The budget this job is sized against: 560 mutants, about 1m20s, 100.00%. It
# was 121 mutants in 48-50 seconds before internal/mutation's suites grew the
# tests that let the scope take that whole package, and 16 mutants in 7m08s
# before a `test.command` naming package patterns began to scope the *test
# binaries* rather than only the baseline -- so a mutant runs the suites that
# cover it instead of every suite in the module, internal/discover's
# toolchain-driving one included.
#
# --strict is passed rather than written into the file because the gate belongs
# to the caller: policy.strict stays false so that `go-mutants run` on a
# developer's machine reports a survivor instead of failing on it, and this
# task is the caller that insists. That flag is the whole difference between
# the two runs, and it is the only thing that fails this job on one survivor --
# policy.minimum_score = 99 is compared either way and does not fail until six.
# --profile balanced is redundant with the file and stated anyway, so that a
# change to the file's profile shows up as a conflict to resolve rather than as
# a silently different gate.
#
# The one variable is load-bearing:
#
#   RAPID_SEED=1      pgregory.net/rapid draws a fresh random seed per process
#                     unless one is pinned, and internal/interval's property
#                     suite is part of what kills these mutants. Unpinned, a
#                     marginal mutant could be killed on one run and survive on
#                     the next, which would make the score -- and therefore the
#                     minimum_score gate -- a coin flip. Nightly re-explores
#                     with random seeds and a far bigger budget instead. It is a
#                     variable rather than a test.command argument because rapid
#                     reads it with os.LookupEnv in its own init() (engine.go),
#                     where it becomes the default for -rapid.seed, and
#                     internal/execute hands this process's environment to every
#                     per-mutant test binary -- which is what a test.command
#                     argument would not reach.
#
# This task used to export GOFLAGS=-vet=off as well, and no longer does, because
# no user should have to. The instrumented snapshot is generated code that
# splices every mutant of an expression in beside the original, so
# `x == "." && x == ".."` is a normal shape in it and vet's `bools` analyzer
# rejects exactly that; the engine now merges `-vet=off` into GOFLAGS itself for
# the two commands it issues against that tree -- the instrumented baseline and
# the per-package `go test -c` -- and leaves the pristine baseline vetted, so a
# real finding in this repository's own source still fails this job.
#
# The run goes through `testcache exec` for the same reason the integration
# suite does, and rather more urgently: a mutation run compiles a per-package
# test binary for every mutant it schedules, each against a snapshot at an
# absolute path that exists for that run alone, so it is the single biggest
# producer of cache entries nothing will ever look up again. The wrapper exports
# GOCACHE and GO_MUTANTS_TEST_GOCACHE into the run, prints the size and the
# growth to stderr when it ends, empties the cache if the run left it over
# 4GiB, and exits with the run's own status -- so --strict still fails this job
# on one undeclared survivor.
#
# One consequence is worth stating rather than discovering: the inner
# `go run ./cmd/go-mutants` compiles go-mutants *itself* into the test cache,
# which is exactly what the note on [tasks.test] above says that task avoids.
# The trade is accepted here because the alternative is worse in both
# directions. Compiling the CLI into the developer's own cache while its
# thousands of grandchildren compile into the test one would split a single run
# across two caches, so a `test-clean` would leave half of it behind and the
# reported growth would be missing its first hundred megabytes; and there is no
# way to point only the grandchildren at a different GOCACHE, because they
# inherit the environment this process is started with. go-mutants' own
# compilation is a rounding error next to what the run then does, and the whole
# lot is trimmed by the same budget.
description = "Mutation-test this repository with go-mutants itself"
env = { RAPID_SEED = "1" }
run = "go run ./internal/devtools/testcache exec --budget 4GiB -- go run ./cmd/go-mutants run --strict --profile balanced"

[tasks.package]
# Snapshot artifacts, so that the packaging path is exercised on every CI run
# rather than for the first time on a tag. The release workflow drives the same
# .goreleaser.yaml without --snapshot.
#
# The smoke is not `--version; echo ok`. A build whose `-X` missed its target
# links and runs perfectly and prints the compiled-in default, so the check
# asserts that what came out is the version goreleaser stamped rather than
# internal/cli's own fallback. That is the one packaging mistake nothing else
# in this repository would catch.
#
# The fallback is read out of the source with `go run` rather than written here
# as a literal, so that bumping internal/cli.Version cannot quietly turn this
# check into one that passes for an unstamped build.
#
# `doctor --json` is deliberately not part of the smoke. It probes for a Go
# toolchain, which is a fact about the machine unpacking the archive rather
# than about the archive, and a packaging gate that fails because a bare
# container has no `go` fails for the wrong reason.
description = "Build unpublished snapshot artifacts and smoke-test the binary"
run = ["goreleaser release --snapshot --clean", '''
  set -eu
  os=$(uname -s | tr '[:upper:]' '[:lower:]')
  case $(uname -m) in
    x86_64|amd64) arch=amd64_v1 ;;
    arm64|aarch64) arch=arm64_v8.0 ;;
    *) echo "unpackaged architecture: $(uname -m)" >&2; exit 1 ;;
  esac
  binary="dist/go-mutants_${os}_${arch}/go-mutants"
  fallback=$(go run ./cmd/go-mutants --version)
  printed=$("$binary" --version)
  echo "$binary says: $printed"
  case $printed in
    "go-mutants "*) ;;
    *) echo "unexpected --version output: $printed" >&2; exit 1 ;;
  esac
  if [ "$printed" = "$fallback" ]; then
    echo "the -X ldflag did not stamp internal/cli.Version: still $printed" >&2
    exit 1
  fi
  ''']
run_windows = [
  "goreleaser release --snapshot --clean",
  '''pwsh -NoLogo -NoProfile -Command "$b = 'dist/go-mutants_windows_amd64_v1/go-mutants.exe'; $fallback = (go run ./cmd/go-mutants --version); $v = & $b --version; Write-Output ($b + ' says: ' + $v); if ($v -notlike 'go-mutants *') { Write-Output ('unexpected --version output: ' + $v); exit 1 }; if ($v -eq $fallback) { Write-Output ('the -X ldflag did not stamp internal/cli.Version: still ' + $v); exit 1 }"''',
]

[tasks.hooks]
description = "Install the git pre-commit and commit-msg hooks"
run = "lefthook install"
