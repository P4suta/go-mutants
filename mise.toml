[tools]
go = "1.26.6"
golangci-lint = "2.12.2"
"ubi:goreleaser/goreleaser" = "2.17.1"
lefthook = "2.1.10"
just = "1.57.0"
actionlint = "1.7.12"
typos = "1.48.0"
taplo = "0.10.0"
"ubi:crate-ci/committed" = "1.1.11"
gitleaks = "8.30.1"
yamllint = "1.38.0"
rumdl = "0.2.43"
"cargo:ocomment" = "0.1.0"

[tasks.bootstrap]
description = "Install the pinned toolchain, download modules, and install hooks"
run = ["mise install", "go mod download", "lefthook install"]

[tasks.build]
description = "Build every package and run the vet gate"
run = ["go build ./... ./goatest/...", "go vet ./... ./goatest/..."]

[tasks.build-published]
description = "Build each module on its own, the way a consumer gets it"
env = { GOWORK = "off" }
run = [
  "go build ./...",
  "go vet ./...",
  "go -C goatest build ./...",
  "go -C goatest vet ./...",
]

[tasks.test]
description = "Run the unit test suite"
run = "go test -timeout 15m ./... ./goatest/..."

[tasks.test-race]
description = "Run the unit test suite under the race detector"
run = "go test -race -timeout 30m ./... ./goatest/..."

[tasks.test-integration]
description = "Run the toolchain-backed integration suite"
run = "go run ./internal/devtools/testcache exec --budget 4GiB -- go test -tags integration -timeout 40m ./... ./goatest/..."

[tasks.test-integration-race]
description = "Run the integration suite under the race detector"
run = "go run ./internal/devtools/testcache exec --budget 4GiB -- go test -race -tags integration -timeout 90m ./... ./goatest/..."

[tasks.test-cost]
description = "Run the unit test suite and print a per-package cost table"
run = "go run ./internal/devtools/testcost -- go test -json -count=1 -timeout 15m ./... ./goatest/..."

[tasks.test-cost-integration]
description = "Run the integration suite and print a per-package cost table"
run = "go run ./internal/devtools/testcache exec --budget 4GiB -- go run ./internal/devtools/testcost -- go test -json -count=1 -tags integration -timeout 40m ./... ./goatest/..."

[tasks.cover]
description = "Measure unit-tier coverage and render it, as a signal and never a gate"
run = [
  "go test -covermode=atomic -coverprofile=cover.out -timeout 15m ./... ./goatest/... || echo 'cover: the suite failed; the profile below is of the run that failed' >&2",
  "go tool cover -html=cover.out -o cover.html",
  "go tool cover -func=cover.out | tail -1",
]

[tasks.cover-integration]
description = "Measure integration-tier coverage across every package"
run = [
  "go run ./internal/devtools/testcache exec --budget 4GiB -- go test -covermode=atomic -coverprofile=cover.out -coverpkg=./...,./goatest/... -tags integration -timeout 90m ./... ./goatest/... || echo 'cover-integration: the suite failed; the profile below is of the run that failed' >&2",
  "go tool cover -html=cover.out -o cover.html",
  "go tool cover -func=cover.out | tail -1",
]

[tasks.bench]
description = "Run the benchmarks and write bench.txt"
run = "go test -run '^$' -bench . -benchmem ./internal/glob ./internal/config ./internal/snapshot > bench.txt"

[tasks.test-cache-status]
description = "Print where the test-owned build cache is and how much it holds"
run = "go run ./internal/devtools/testcache status"

[tasks.test-clean]
description = "Empty the test-owned build cache and the kept scratch root"
run = "go run ./internal/devtools/testcache clean"

[tasks.golden-update]
description = "Rewrite the committed golden files, to be read before committing"
run = [
  "go test ./internal/cli ./internal/console ./internal/instrument ./internal/report ./internal/tui ./trace -update",
  "go test -tags integration ./internal/engine -update",
]

[tasks.fmt]
description = "Check Go and TOML formatting without rewriting any file"
run = [
  'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }',
  "taplo fmt --check mise.toml .go-mutants.toml .typos.toml REUSE.toml committed.toml .rumdl.toml .gitleaks.toml goatest/.goatest.toml goatest/REUSE.toml goatest/.gitleaks.toml",
]
run_windows = [
  'pwsh -NoLogo -NoProfile -Command "$f = gofmt -l .; if ($f) { $f; exit 1 }"',
  "taplo fmt --check mise.toml .go-mutants.toml .typos.toml REUSE.toml committed.toml .rumdl.toml .gitleaks.toml goatest/.goatest.toml goatest/REUSE.toml goatest/.gitleaks.toml",
]

[tasks.lint]
description = "Run the Go, spelling, TOML, workflow, YAML, secret, and doc linters"

run = [
  "go run ./cmd/gomutants-vet ./... ./goatest/...",
  "git ls-files | grep -vE '^(fixtures/|vendor-assets/|LICENSES/)|/testdata/|[.]go$' | tr '\\n' '\\0' | xargs -0 ocomment check --policy legal",
  "golangci-lint run",
  "typos",
  "taplo check mise.toml .go-mutants.toml .typos.toml REUSE.toml committed.toml .rumdl.toml .gitleaks.toml goatest/.goatest.toml goatest/REUSE.toml goatest/.gitleaks.toml",
  "actionlint",
  "yamllint .github lefthook.yml .golangci.yml",
  "gitleaks dir . --config .gitleaks.toml --no-banner --redact --verbose",
  "rumdl check .",
]

[tasks.check]
description = "Run every local gate that CI runs, in CI order"
run = [
  "mise run fmt",
  "mise run build",
  "mise run build-published",
  "mise run test",
  "mise run lint",
]
[tasks.dogfood]
description = "Mutation-test this repository with go-mutants itself"
env = { RAPID_SEED = "1" }
run = "go run ./internal/devtools/testcache exec --budget 4GiB -- go run ./cmd/go-mutants run --strict --profile balanced"

[tasks.dogfood-audit]
description = "Dogfood with a recording, then re-derive the report from it"
run = [
  "go run ./internal/devtools/testcache exec --budget 4GiB -- go run ./cmd/go-mutants run --strict --profile balanced --trace",
  "go run ./cmd/go-mutants report latest --json > reports/mutation/latest-run-report.json",
  "go run ./internal/devtools/traceaudit/main.go reports/mutation/latest-run-report.json reports/mutation/trace",
]


[tasks.package]
description = "Build unpublished snapshot artifacts and smoke-test the binary"
run = ["goreleaser release --snapshot --clean", '''
  set -eu
  os=$(uname -s | tr '[:upper:]' '[:lower:]')
  case $(uname -m) in
    x86_64|amd64) arch=amd64_v1 ;;
    arm64|aarch64) arch=arm64_v8.0 ;;
    *) echo "unpackaged architecture: $(uname -m)" >&2; exit 1 ;;
  esac
  binary="dist/go-mutants_${os}_${arch}/go-mutants"
  fallback=$(go run ./cmd/go-mutants --version)
  printed=$("$binary" --version)
  echo "$binary says: $printed"
  case $printed in
    "go-mutants "*) ;;
    *) echo "unexpected --version output: $printed" >&2; exit 1 ;;
  esac
  if [ "$printed" = "$fallback" ]; then
    echo "the -X ldflag did not stamp internal/cli.Version: still $printed" >&2
    exit 1
  fi
  ''']
run_windows = [
  "goreleaser release --snapshot --clean",
  '''pwsh -NoLogo -NoProfile -Command "$b = 'dist/go-mutants_windows_amd64_v1/go-mutants.exe'; $fallback = (go run ./cmd/go-mutants --version); $v = & $b --version; Write-Output ($b + ' says: ' + $v); if ($v -notlike 'go-mutants *') { Write-Output ('unexpected --version output: ' + $v); exit 1 }; if ($v -eq $fallback) { Write-Output ('the -X ldflag did not stamp internal/cli.Version: still ' + $v); exit 1 }"''',
]

[tasks.hooks]
description = "Install the git pre-commit and commit-msg hooks"
run = "lefthook install"

[tasks.dogfood-runner]
dir = "goatest"
description = "Run goatest against its own module"
env = { GOWORK = "off" }
run = [
  "go build -o ./dist/dogfood/goatest ./cmd/goatest",
  "./dist/dogfood/goatest verify --ui=plain",
]
run_windows = [
  "go build -o ./dist/dogfood/goatest.exe ./cmd/goatest",
  '.\dist\dogfood\goatest.exe verify --ui=plain',
]


[tasks.test-audit]
dir = "goatest"
env = { GOWORK = "off" }
description = "Run the unit tier and audit what actually ran"
run = """
mkdir -p .goatest
go test -json -timeout 40m ./... > .goatest/test-events.jsonl && audit_exit=0 || audit_exit=$?
go run ./internal/devtools/testaudit < .goatest/test-events.jsonl || audit_exit=1
exit $audit_exit
"""
run_windows = """
New-Item -ItemType Directory -Force -Path .goatest | Out-Null
go test -json -timeout 40m ./... > .goatest/test-events.jsonl
$auditExit = $LASTEXITCODE
Get-Content .goatest/test-events.jsonl | go run ./internal/devtools/testaudit
if ($LASTEXITCODE -ne 0) { $auditExit = 1 }
exit $auditExit
"""


[tasks.test-integration-audit]
dir = "goatest"
env = { GOWORK = "off" }
description = "Run both tiers and audit what actually ran"
run = """
mkdir -p .goatest
go test -json -tags integration -timeout 40m ./... > .goatest/integration-events.jsonl && audit_exit=0 || audit_exit=$?
go run ./internal/devtools/testaudit < .goatest/integration-events.jsonl || audit_exit=1
exit $audit_exit
"""
run_windows = """
New-Item -ItemType Directory -Force -Path .goatest | Out-Null
go test -json -tags integration -timeout 40m ./... > .goatest/integration-events.jsonl
$auditExit = $LASTEXITCODE
Get-Content .goatest/integration-events.jsonl | go run ./internal/devtools/testaudit
if ($LASTEXITCODE -ne 0) { $auditExit = 1 }
exit $auditExit
"""

[tasks.dogfood-changed]
dir = "goatest"
env = { GOWORK = "off" }
description = "Verify what this branch changed, the way docs/ci.md tells a user to"
run = [
  "go build -o ./dist/dogfood/goatest ./cmd/goatest",
  "./dist/dogfood/goatest verify --changed=origin/main --ui=plain",
]
run_windows = [
  "go build -o ./dist/dogfood/goatest.exe ./cmd/goatest",
  '.\dist\dogfood\goatest.exe verify --changed=origin/main --ui=plain',
]


[tasks.trace-summary-runner]
dir = "goatest"
env = { GOWORK = "off" }
description = "Summarize a goatest-trace-v1 stream into the run's performance breakdown"
run = "go run ./internal/devtools/tracesummary"


[tasks.report-diff]
dir = "goatest"
env = { GOWORK = "off" }
description = "Compare two assurance reports: verdict, accounting, mutant transitions, and lost kills"
run = "go run ./internal/devtools/reportdiff"


[tasks.proof-audit]
dir = "goatest"
env = { GOWORK = "off" }
description = "Audit the proof layers of a recorded run: proof-audit TRACE.jsonl PROFILES-DIR"
run = "go run ./internal/devtools/proofaudit"
