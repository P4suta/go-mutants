---

name: Bug report
description: Report a reproducible defect in go-mutants
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting a bug. Mutation reports and diagnostics can contain
        source code and local paths; remove private data before submitting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and private source from the report.
          required: true
  - type: input
    id: version
    attributes:
      label: go-mutants version or commit
      placeholder: 0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, and Go toolchain version.
      placeholder: Windows 11 x64; go1.26.6
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >-
        Provide commands and a minimal public module or source excerpt.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: >-
        Include GOM diagnostic codes and logs only after removing private data.
      render: text
