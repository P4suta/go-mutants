---
# SPDX-FileCopyrightText: 2026 go-mutants contributors
# SPDX-License-Identifier: MIT OR Apache-2.0

name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_MUTANTS_TEST_REQUIRE_TOOLS: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true
      - run: mise run check
      - name: The corpus is unchanged
        if: always()
        shell: bash
        run: |
          changed="$(git status --porcelain --ignored -- fixtures)"
          if [ -n "$changed" ]; then
            echo "::error::the test suite wrote into fixtures/:"
            echo "$changed"
            exit 1
          fi
      - name: committed (pull request range)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: >-
          committed ${{ github.event.pull_request.base.sha }}..${{
          github.event.pull_request.head.sha }}
      - name: committed (pushed head)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git rev-parse -q --verify 'HEAD~' > /dev/null; then
            committed HEAD~..HEAD
          else
            committed HEAD
          fi

  platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Point the test build cache and the kept scratch at the runner
        shell: bash
        run: |
          {
            echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
            echo "GO_MUTANTS_TEST_KEEP=1"
            echo "GO_MUTANTS_TEST_KEEP_DIR=$RUNNER_TEMP/go-mutants-kept"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true
      - run: mise run build
      - run: mise run test-cost
      - run: mise run test-cost-integration
      - name: The corpus is unchanged
        if: success() || failure()
        shell: bash
        run: |
          changed="$(git status --porcelain --ignored -- fixtures)"
          if [ -n "$changed" ]; then
            echo "::error::the test suite wrote into fixtures/:"
            echo "$changed"
            exit 1
          fi
      - name: Test build cache
        if: success() || failure()
        continue-on-error: true
        run: mise run test-cache-status
      - name: Upload what the failed tests kept
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kept-scratch-${{ matrix.os }}
          path: ${{ runner.temp }}/go-mutants-kept
          retention-days: 14
          if-no-files-found: ignore

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Point the test build cache and the kept scratch at the runner
        shell: bash
        run: |
          {
            echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
            echo "GO_MUTANTS_TEST_KEEP=1"
            echo "GO_MUTANTS_TEST_KEEP_DIR=$RUNNER_TEMP/go-mutants-kept"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true
      - run: mise run test-race
      - name: The corpus is unchanged
        if: success() || failure()
        shell: bash
        run: |
          changed="$(git status --porcelain --ignored -- fixtures)"
          if [ -n "$changed" ]; then
            echo "::error::the test suite wrote into fixtures/:"
            echo "$changed"
            exit 1
          fi
      - name: Upload what the failed tests kept
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kept-scratch-race
          path: ${{ runner.temp }}/go-mutants-kept
          retention-days: 14
          if-no-files-found: ignore

  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Point the test build cache and the kept scratch at the runner
        shell: bash
        run: |
          {
            echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
            echo "GO_MUTANTS_TEST_KEEP=1"
            echo "GO_MUTANTS_TEST_KEEP_DIR=$RUNNER_TEMP/go-mutants-kept"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true
      - name: Measure coverage
        id: coverage
        continue-on-error: true
        run: mise run cover-integration
      - name: The corpus is unchanged
        if: success() || failure()
        shell: bash
        run: |
          changed="$(git status --porcelain --ignored -- fixtures)"
          if [ -n "$changed" ]; then
            echo "::error::the test suite wrote into fixtures/:"
            echo "$changed"
            exit 1
          fi
      - name: Upload the coverage profile and its rendering
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage
          path: |
            cover.out
            cover.html
          retention-days: 14
          if-no-files-found: warn
      - name: Test build cache
        if: success() || failure()
        continue-on-error: true
        run: mise run test-cache-status
      - name: Upload what the failed tests kept
        if: failure() || steps.coverage.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kept-scratch-coverage
          path: ${{ runner.temp }}/go-mutants-kept
          retention-days: 14
          if-no-files-found: ignore

  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true
      - run: mise run package
      - name: Upload the snapshot artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-snapshot
          path: dist/
          retention-days: 14
          if-no-files-found: error

  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Point the test build cache at the runner's temporary directory
        shell: bash
        run: >-
          echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
          >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true
      - run: mise run dogfood
      - name: The corpus is unchanged
        if: always()
        shell: bash
        run: |
          changed="$(git status --porcelain --ignored -- fixtures)"
          if [ -n "$changed" ]; then
            echo "::error::the test suite wrote into fixtures/:"
            echo "$changed"
            exit 1
          fi
      - name: Test build cache
        if: success() || failure()
        continue-on-error: true
        run: mise run test-cache-status
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
          if-no-files-found: warn

  action-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true
      - name: Build the go-mutants under test and put it on PATH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/go-mutants" ./cmd/go-mutants
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - id: measured
        uses: ./.github/actions/go-mutants
        with:
          version: skip
          working-directory: fixtures/killable
          report: ${{ runner.temp }}/killable-report.json
          fail: "false"
      - name: The outputs are there and agree with each other
        shell: bash
        env:
          STATUS: ${{ steps.measured.outputs.status }}
          TOTAL: ${{ steps.measured.outputs.total }}
          KILLED: ${{ steps.measured.outputs.killed }}
          SURVIVED: ${{ steps.measured.outputs.survived }}
          TIMED_OUT: ${{ steps.measured.outputs.timed-out }}
          SCORE: ${{ steps.measured.outputs.score }}
          EXIT_CODE: ${{ steps.measured.outputs.exit-code }}
          REPORT: ${{ steps.measured.outputs.report }}
        run: |
          set -euo pipefail
          test "$STATUS" = completed
          test -s "$REPORT"
          test "$TOTAL" -gt 0
          test "$SURVIVED" -gt 0
          # The total the action reported is the total the document holds,
          # which is the one number that proves the outputs were read from the
          # report rather than scraped off the console.
          jq -e --argjson t "$TOTAL" \
            '.summary.total == $t' "$REPORT" > /dev/null
          test $((KILLED + SURVIVED + TIMED_OUT)) -le "$TOTAL"
          # A score is a number. An empty one means the run scored nothing,
          # which a fixture with ten mutants did not do.
          case "$SCORE" in
            '' | *[!0-9.]*)
              echo "::error::score is not a number: $SCORE"
              exit 1
              ;;
          esac
          # The exit code is an output whatever `fail` was set to, and a run
          # with an unexpected survivor is a policy failure rather than a
          # broken run.
          test "$EXIT_CODE" = 0 || test "$EXIT_CODE" = 1
          echo "action outputs: $STATUS $TOTAL/$KILLED/$SURVIVED score $SCORE"

  ci-success:
    needs:
      - quality
      - platform-tests
      - race
      - coverage
      - artifacts
      - dogfood
      - action-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate succeeded or was skipped by design
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          passed='.value.result == "success" or .value.result == "skipped"'
          # One entry, rendered. It is a line and not a whole pipeline because
          # it is used on both an object and an already-filtered list: the
          # first version began with to_entries and was applied to the output
          # of map(select(...)), which is entries already -- so jq indexed the
          # array and every failure this job exists to name printed as
          # `0: null`. The one line a reader needs was the one line that broke.
          line='"\(.key): \(.value.result)"'
          entries="to_entries | .[] | $line"
          failed=$(printf '%s' "$RESULTS" |
            jq -r "to_entries | map(select($passed | not)) | .[] | $line")
          if [ -n "$failed" ]; then
            echo "::error::gates that did not pass:"
            printf '%s\n' "$failed"
            exit 1
          fi
          printf '%s' "$RESULTS" | jq -r "$entries"
