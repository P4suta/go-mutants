---
# SPDX-FileCopyrightText: 2026 go-mutants contributors
# SPDX-License-Identifier: MIT OR Apache-2.0

name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A missing go or git must fail CI rather than silently narrow the suite to
  # the tests that need no toolchain.
  GO_MUTANTS_TEST_REQUIRE_TOOLS: "1"

# One run per ref: a newer push supersedes the older run instead of queueing
# behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything a contributor runs locally as `mise run check`, plus the
  # commit-message gate, which needs the history a shallow clone omits.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      - run: mise run check
      # The same gate as platform-tests', and for the same reason: the corpus is
      # an input, and a job that wrote where it reads cannot be trusted to have
      # noticed. `always()` rather than `success() || failure()` because this
      # job's other steps are conditional, and a corpus edited by a step that
      # then skipped the rest would otherwise go unreported. The reasoning
      # behind `--ignored` and the printed listing is written out once, in the
      # platform-tests job below.
      - name: The corpus is unchanged
        if: always()
        shell: bash
        run: |
          changed="$(git status --porcelain --ignored -- fixtures)"
          if [ -n "$changed" ]; then
            echo "::error::the test suite wrote into fixtures/:"
            echo "$changed"
            exit 1
          fi
      # Dependabot writes commit bodies full of release-note links far past
      # committed's 100-column line limit, and its messages are rewritten at
      # squash-merge time anyway (the merge subject and body are supplied by
      # the merger), so linting the machine's draft would only gate what never
      # reaches main.
      - name: committed (pull request range)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: >-
          committed ${{ github.event.pull_request.base.sha }}..${{
          github.event.pull_request.head.sha }}
      - name: committed (pushed head)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git rev-parse -q --verify 'HEAD~' > /dev/null; then
            committed HEAD~..HEAD
          else
            committed HEAD
          fi

  # The engine drives the real Go toolchain, kills process trees, and takes
  # long-path and file-locking hazards seriously, so every tier-1 OS runs the
  # suites rather than trusting a single Linux job.
  platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      # The suites' child `go` commands key their entries on absolute paths that
      # exist for one run, so the cache they fill is rubble by the time the job
      # ends. It lives under the runner's own temporary area: that directory
      # dies with the runner and is deliberately never restored by
      # actions/cache, so a job can never inherit yesterday's gigabytes.
      #
      # Published through $GITHUB_ENV rather than the job's `env:` because the
      # `runner` context is not available there, and a job-level value is what
      # this has to be: every step below reads it, the last one included. Under
      # bash on Windows $RUNNER_TEMP is a `D:\a\_temp` path, so the value is
      # absolute with mixed separators -- which both copies of the rule (testkit
      # and internal/devtools/testcache) normalise with filepath.Clean.
      #
      # The same step turns keeping on and names where a failed test files what
      # it left. A test that fails on a runner nobody can log into is diagnosed
      # from what it printed, and everything else it had -- the fixture copy,
      # the instrumented tree, the commands it ran -- was removed by the
      # cleanup that follows the assertion. `1` is keep-on-failure: a green job
      # leaves nothing, so a passing run pays one mkdir per test and no more.
      # A typo in the value is refused rather than read as "off", because the
      # only symptom of that would be a failed job with nothing to upload.
      - name: Point the test build cache and the kept scratch at the runner
        shell: bash
        run: |
          {
            echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
            echo "GO_MUTANTS_TEST_KEEP=1"
            echo "GO_MUTANTS_TEST_KEEP_DIR=$RUNNER_TEMP/go-mutants-kept"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      - run: mise run build
      # Both tiers through internal/devtools/testcost rather than as bare `go
      # test` runs. The commands underneath are the same ones -- the tool reads
      # `go test -json` and exits with the run's own verdict, so this gates
      # exactly as strictly as it did -- and what it adds is the two numbers a
      # log does not carry: where the time went, per package, and what did not
      # run at all. The table is appended to $GITHUB_STEP_SUMMARY and rendered
      # on this run's own page, which is the only place anybody would see it.
      #
      # --no-skips is deliberately not passed; the reasoning is written out in
      # full on [tasks.test-cost] in mise.toml. Briefly: every remaining
      # `t.Skip` in this repository is a platform-capability guard or a fuzz
      # body rejecting an input, at least one fires on each of these three
      # operating systems, and the skips the flag was wanted for -- a missing
      # tool -- are already fatal here through GO_MUTANTS_TEST_REQUIRE_TOOLS.
      - run: mise run test-cost
      - run: mise run test-cost-integration
      # The corpus is an input, never an output. Every integration suite runs
      # against a disposable copy of a fixture module, because a run writes
      # `reports/mutation/` into the tree it is pointed at and several tests
      # read the same module at once -- so a fixture that has changed means a
      # suite wrote where it reads, whatever it then went on to assert.
      #
      # It gates rather than reports, and it is a step of its own rather than a
      # test, because a test that ran inside a dirty tree is exactly the test
      # that cannot be trusted to notice. It runs after a failed suite as well
      # as after a green one -- a run that wrote into the corpus and then failed
      # is the case most worth naming -- but not after a cancellation, where
      # half a suite has written half of what it would have.
      #
      # `--ignored` is what makes this a gate rather than a formality. The files
      # a stray run leaves are the ones .gitignore covers:
      # `**/reports/mutation/` is ignored precisely so that a manual run inside
      # a fixture cannot be committed, and `*.test` and `*.out` are ignored for
      # the same kind of reason. Without it the step would pass over every one
      # of them and only ever catch an edited fixture. The runner starts from a
      # fresh checkout, so anything ignored under fixtures/ was written here --
      # which is what makes the strict reading affordable in CI and not on a
      # developer's machine, where the same directory may be a fortnight old.
      #
      # `--` separates the pathspec from any revision of the same name, and the
      # listing is printed before the failure: "the corpus changed" without
      # saying how is a message that sends the reader back to the runner to find
      # out.
      - name: The corpus is unchanged
        if: success() || failure()
        shell: bash
        run: |
          changed="$(git status --porcelain --ignored -- fixtures)"
          if [ -n "$changed" ]; then
            echo "::error::the test suite wrote into fixtures/:"
            echo "$changed"
            exit 1
          fi
      # What the suite left behind, on every platform and whatever the suite
      # did. It is the only measurement of this that anybody sees, and a run
      # that failed is exactly when the number is interesting -- so it reports
      # rather than gates: `continue-on-error` keeps a broken report from
      # failing the job, and `success() || failure()` runs it after a failed
      # suite but not after a cancellation, where the numbers would be about
      # half a run. Through mise rather than a bare `go run`, so that the task
      # definition stays the single place this command is written down.
      - name: Test build cache
        if: success() || failure()
        continue-on-error: true
        run: mise run test-cache-status
      # What the failed tests left behind, off the runner and into an artifact.
      # One directory per failed test, each with a KEPT.txt naming the test, the
      # fixture, the toolchain, the build cache, the test's other kept
      # directories and every child run through testkit.Exec, the instrumented
      # source the failure dumped, and the recording of what the run actually
      # executed.
      #
      # `if: failure()` because a green job keeps nothing, and
      # `if-no-files-found: ignore` because a job can go red before any test
      # does -- a build, a lint step -- and a warning about a missing artifact
      # on top of that failure explains nothing.
      - name: Upload what the failed tests kept
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kept-scratch-${{ matrix.os }}
          path: ${{ runner.temp }}/go-mutants-kept
          retention-days: 14
          if-no-files-found: ignore

  # The unit tier under the race detector, which had never been run at all.
  #
  # This repository schedules mutants across a worker pool, fans a snapshot copy
  # out over goroutines, merges coverage from concurrent readers and kills
  # process trees from a supervisor -- and until this job existed, the one tool
  # that finds a data race in any of that was not part of any gate. A race that
  # only appears under load is otherwise found by a user, once, in a report
  # nobody can reproduce.
  #
  # Ubuntu only, and cgo is the reason rather than thrift: -race links the C
  # runtime, so it needs a working C toolchain, and the Windows runner's is a
  # different compiler with different failures to debug. A data race is a
  # property of the Go code, not of the platform, so one platform proves it.
  #
  # The integration tier under -race is nightly (race-integration), not here: it
  # is the better part of an hour, and the pull request should not wait for it.
  #
  # 35 minutes against the task's own 30m alarm, so that a suite which ran out
  # of budget reports itself -- with the package that hung and a stack -- in the
  # five minutes before the runner cancels the job and says nothing at all.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # Same rule and the same reason as platform-tests, keeping included: the
      # suites' child `go` commands key entries on paths that exist for one run,
      # so their cache lives in the runner's temporary area and dies with it,
      # and a test that fails under -race leaves what it had beside it.
      - name: Point the test build cache and the kept scratch at the runner
        shell: bash
        run: |
          {
            echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
            echo "GO_MUTANTS_TEST_KEEP=1"
            echo "GO_MUTANTS_TEST_KEEP_DIR=$RUNNER_TEMP/go-mutants-kept"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      - run: mise run test-race
      # The same gate as platform-tests', and for the same reason: the corpus is
      # an input, and a suite that wrote where it reads cannot be trusted to
      # have noticed. The reasoning behind `--ignored`, the `success() ||
      # failure()` condition and the printed listing is written out once, in
      # ci.yml's platform-tests job.
      - name: The corpus is unchanged
        if: success() || failure()
        shell: bash
        run: |
          changed="$(git status --porcelain --ignored -- fixtures)"
          if [ -n "$changed" ]; then
            echo "::error::the test suite wrote into fixtures/:"
            echo "$changed"
            exit 1
          fi
      # What the failed tests left behind, off the runner and into an artifact.
      # One directory per failed test, each with a KEPT.txt naming the test, the
      # fixture, the toolchain, the build cache, the test's other kept
      # directories and every child run through testkit.Exec, the instrumented
      # source the failure dumped, and the recording of what the run actually
      # executed.
      #
      # `if: failure()` because a green job keeps nothing, and
      # `if-no-files-found: ignore` because a job can go red before any test
      # does -- a build, a lint step -- and a warning about a missing artifact
      # on top of that failure explains nothing.
      - name: Upload what the failed tests kept
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kept-scratch-race
          path: ${{ runner.temp }}/go-mutants-kept
          retention-days: 14
          if-no-files-found: ignore

  # Coverage of the integration tier, as an artifact and never as a gate.
  #
  # There is no threshold in this job and there is not going to be one. A
  # coverage percentage measures which lines ran, not which behaviour is
  # checked, and a number defended by a gate is a number people write tests for.
  # The gate on whether the tests catch anything already exists and is far
  # stricter: the dogfood job runs go-mutants against go-mutants with --strict.
  # This answers the one question mutation cannot answer cheaply -- what did
  # nobody even run -- and it answers it by handing over a file to read.
  #
  # `continue-on-error` is what "never a gate" means in a workflow. A profile
  # that could not be written, or a suite that went red here after passing in
  # platform-tests, is a thing to look at rather than a thing to block a merge.
  #
  # The integration tier rather than the unit one, because that is where most of
  # this repository's lines are actually executed, and with -coverpkg=./... so
  # that a package is credited for the lines its callers ran. The number is
  # still a floor: a suite that starts a child `go test` gets no credit for what
  # the child ran, because the child is a different binary with no counters.
  #
  # Not on pull requests. It is ninety minutes of instrumented integration suite
  # that cannot fail anything, and a job like that on every push of every branch
  # doubles the runner time this repository spends to produce a file most pull
  # requests never open. On main it is a trend somebody can read; on a pull
  # request it is a queue. `workflow_dispatch` is how to get one on demand.
  #
  # 100 minutes against the task's own 90m alarm, so that a suite which ran out
  # of budget reports itself -- with the package that hung and a stack -- in the
  # ten minutes before the runner cancels the job and says nothing at all.
  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Point the test build cache and the kept scratch at the runner
        shell: bash
        run: |
          {
            echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
            echo "GO_MUTANTS_TEST_KEEP=1"
            echo "GO_MUTANTS_TEST_KEEP_DIR=$RUNNER_TEMP/go-mutants-kept"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      # `id`, because the step below has to be able to ask how this one went.
      # `continue-on-error` makes the *job* succeed whatever the suite did, so
      # `failure()` is false here even when every test in the tier went red --
      # and the kept scratch, which is exactly what somebody would want to read
      # in that case, was never uploaded. `outcome` is the step's own result
      # before `continue-on-error` is applied, which is the only place that fact
      # survives.
      - name: Measure coverage
        id: coverage
        continue-on-error: true
        run: mise run cover-integration
      # The same gate as platform-tests', and for the same reason: the corpus is
      # an input, and a suite that wrote where it reads cannot be trusted to
      # have noticed. The reasoning behind `--ignored`, the `success() ||
      # failure()` condition and the printed listing is written out once, in
      # ci.yml's platform-tests job.
      - name: The corpus is unchanged
        if: success() || failure()
        shell: bash
        run: |
          changed="$(git status --porcelain --ignored -- fixtures)"
          if [ -n "$changed" ]; then
            echo "::error::the test suite wrote into fixtures/:"
            echo "$changed"
            exit 1
          fi
      # cover.out is what `go tool cover` and every editor reads; cover.html is
      # what a reviewer opens. Both, because regenerating the rendering needs
      # the profile *and* the checkout it was measured against.
      - name: Upload the coverage profile and its rendering
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage
          path: |
            cover.out
            cover.html
          retention-days: 14
          if-no-files-found: warn
      # As in platform-tests: a report, never a gate.
      - name: Test build cache
        if: success() || failure()
        continue-on-error: true
        run: mise run test-cache-status
      # What the failed tests left behind, off the runner and into an artifact.
      # One directory per failed test, each with a KEPT.txt naming the test, the
      # fixture, the toolchain, the build cache, the test's other kept
      # directories and every child run through testkit.Exec, the instrumented
      # source the failure dumped, and the recording of what the run actually
      # executed.
      #
      # `failure()` alone would never fire in this job: the step that runs the
      # suite is `continue-on-error`, so a tier that went entirely red still
      # leaves the job green. Its `outcome` is asked directly, and `failure()`
      # is kept beside it for everything else that can go wrong here.
      # `if-no-files-found: ignore` because a job can go red before any test
      # does -- a build, a lint step -- and a warning about a missing artifact
      # on top of that failure explains nothing.
      - name: Upload what the failed tests kept
        if: failure() || steps.coverage.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kept-scratch-coverage
          path: ${{ runner.temp }}/go-mutants-kept
          retention-days: 14
          if-no-files-found: ignore

  # Snapshot artifacts for all six targets, plus the smoke that proves the
  # version was stamped. Packaging breaks quietly -- a renamed ldflags target,
  # an archive that lost its licences -- so it runs on every push rather than
  # for the first time on a tag.
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # goreleaser reads the tag history to work out a version, and a shallow
        # clone leaves it guessing.
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      - run: mise run package
      # Fourteen days is longer than any review takes and shorter than the
      # ninety days the account default would keep six binaries per push for.
      - name: Upload the snapshot artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-snapshot
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # Self-mutation, gated. The scope, the measured score, the floor and the
  # declared expectations all live in .go-mutants.toml; the task adds --strict,
  # so an undeclared survivor fails this job.
  #
  # The budget is generous relative to the under two minutes this scope measures
  # at --jobs 4 locally, because the cost per mutant here is dominated by this
  # repository's own slowest test package rather than by anything go-mutants
  # does, and a runner having a bad day should show up as a slow job rather than
  # a red one. It survived the scope growing from 566 mutants to 600 without
  # being touched, and that is measured rather than assumed: back to back on one
  # machine the two scopes take the same 38 seconds against a cold build cache,
  # which is the only kind this job ever gets, because GO_MUTANTS_TEST_GOCACHE
  # below points at the runner's temporary directory and is never restored.
  # Growing again to 835 cost real time and still did not move it: cold runs of
  # that scope measured 1m36s and 2m14s on a machine that was doing other
  # things, a good part of that one mutant waiting out the per-mutant timeout,
  # against a budget of twenty-five minutes.
  #
  # 1260 mutants did not move it either, and the shape of that growth was worth
  # a sentence rather than another ratio. On one machine, minutes apart, the
  # eight-package scope ran cold in 52s and the nine-package scope in 1m52s --
  # and almost the whole minute was four more mutants that never return, each
  # waiting out two per-mutant timeouts, rather than the other 421 that widening
  # added. So the number to watch as the scope grows is how many mutants hang,
  # not how many there are.
  #
  # That number is also the one this job learned the hard way, and it is why the
  # budget is not the only thing protecting it now. Two of those four did not
  # hang, they allocated, and on this runner the job did not go red -- it went
  # away, with "The runner has received a shutdown signal", because a mutant had
  # eaten the machine before the ten-second timeout could fire. Every mutant is
  # now bounded in memory the way it is bounded in time, at a derived
  # max(1GiB, largest baseline peak x 4), so a runaway is killed in about a
  # second and reported as a kill. That scope was 1296 mutants and ran cold in
  # 1m48s -- larger and faster than before the bound, because the two that
  # allocate no longer wait out two timeouts each.
  #
  # The scope is now 2497 mutants: internal/report joined, which is nearly as
  # many again, and it brought a fourth mutant that never returns. Warm on a
  # quiet machine that scope is 6m13s-6m30s; cold it is 9m31s, and more than
  # half of the cold figure is those four mutants waiting out, twice each, a
  # timeout sized on the compiling first baseline run (38.7s where the runs
  # after it asked for 10s) -- which the engine now sizes on the runs after
  # the first. Twenty-five minutes has room for the measured cold run two and
  # a half times over; what to watch as the scope grows is how many mutants
  # hang and how loud the runner is, since both move the derived timeout. The
  # memory bound is what keeps a runner from being the thing that runs out
  # first.
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # A mutation run compiles a per-package test binary for every mutant it
      # schedules, against a snapshot at a path that exists for that run alone,
      # so it is the single biggest producer of cache entries nothing will ever
      # look up again. Same rule and the same reason for the same shape as
      # platform-tests: the runner's temporary area, never restored from an
      # actions cache, published through $GITHUB_ENV because the `runner`
      # context is not available in a job's `env:`.
      #
      # GO_MUTANTS_TEST_KEEP is deliberately *not* set here, and it is the one
      # job where that matters. A mutation run over this repository makes its
      # own tests fail on purpose, thousands of times, and every one of those
      # test binaries links the harness: keeping on failure would file a
      # directory per killed mutant, which is a disk full of evidence of the
      # run working exactly as intended.
      - name: Point the test build cache at the runner's temporary directory
        shell: bash
        run: >-
          echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
          >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      - run: mise run dogfood
      # The same gate as platform-tests', and the one job that could break it
      # without running a test suite at all: `mise run dogfood` is go-mutants
      # pointed at this repository, and a run writes into the tree it is pointed
      # at. `always()`, because a run that wrote into the corpus and then failed
      # its own score gate is exactly the case worth naming.
      - name: The corpus is unchanged
        if: always()
        shell: bash
        run: |
          changed="$(git status --porcelain --ignored -- fixtures)"
          if [ -n "$changed" ]; then
            echo "::error::the test suite wrote into fixtures/:"
            echo "$changed"
            exit 1
          fi
      # As in platform-tests: a report, never a gate.
      - name: Test build cache
        if: success() || failure()
        continue-on-error: true
        run: mise run test-cache-status
      # The run report is the source of truth for the score, and reading the
      # HTML beats scrolling the log when the gate does fail.
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
          if-no-files-found: warn
