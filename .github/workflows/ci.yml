---
# SPDX-FileCopyrightText: 2026 go-mutants contributors
# SPDX-License-Identifier: MIT OR Apache-2.0

name: CI

"on":
  merge_group:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_MUTANTS_TEST_REQUIRE_TOOLS: "1"
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_AUTO_INSTALL: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      native: ${{ steps.changes.outputs.native }}
      release: ${{ steps.changes.outputs.release }}
      action: ${{ steps.changes.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: changes
        with:
          base: >-
            ${{ github.event.merge_group.base_sha ||
            github.event.repository.default_branch }}
          filters: .github/filters/ci.yml
      - name: Validate selection outputs
        env:
          CODE_FILTER: ${{ steps.changes.outputs.code }}
          NATIVE_FILTER: ${{ steps.changes.outputs.native }}
          RELEASE_FILTER: ${{ steps.changes.outputs.release }}
          ACTION_FILTER: ${{ steps.changes.outputs.action }}
        run: >-
          jq -en --arg code "$CODE_FILTER" --arg native "$NATIVE_FILTER"
          --arg release "$RELEASE_FILTER" --arg action "$ACTION_FILTER"
          '[$code, $native, $release, $action] |
          all(. == "true" or . == "false")'
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.13
          sha256: >-
            94c45523c7b6760b7da704f16051171ca32e8447a849a02266a439a4455e9a12
          install_args: >-
            actionlint typos taplo ubi:crate-ci/committed gitleaks yamllint
            rumdl just lefthook jq python uv
          cache: true
      - run: mise run lint-text
      - name: committed (pull request range)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: >-
          committed ${{ github.event.pull_request.base.sha }}..${{
          github.event.pull_request.head.sha }}
      - name: committed (pushed head)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git rev-parse -q --verify 'HEAD~' > /dev/null; then
            committed HEAD~..HEAD
          else
            committed HEAD
          fi

  checks:
    needs: [quality]
    if: >-
      needs.quality.outputs.code == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.13
          sha256: >-
            94c45523c7b6760b7da704f16051171ca32e8447a849a02266a439a4455e9a12
          install_args: go rust golangci-lint cargo:ocomment taplo jq
          cache: true
      - run: mise run check-source
      - name: The corpus is unchanged
        if: always()
        run: mise run check-corpus

  platform-tests:
    needs: [quality]
    if: >-
      needs.quality.outputs.native == 'true' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Point the test build cache and the kept scratch at the runner
        shell: bash
        run: |
          {
            echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
            echo "GO_MUTANTS_TEST_KEEP=1"
            echo "GO_MUTANTS_TEST_KEEP_DIR=$RUNNER_TEMP/go-mutants-kept"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.13
          install_args: go rust cargo:ocomment jq
          cache: true
      - run: mise run build
      - run: mise run test-cost-integration
      - name: The corpus is unchanged
        if: success() || failure()
        run: mise run check-corpus
      - name: Test build cache
        if: success() || failure()
        continue-on-error: true
        run: mise run test-cache-status
      - name: Upload what the failed tests kept
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kept-scratch-${{ matrix.os }}
          path: ${{ runner.temp }}/go-mutants-kept
          retention-days: 7
          if-no-files-found: ignore

  race:
    needs: [quality]
    if: >-
      needs.quality.outputs.native == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Point the test build cache and the kept scratch at the runner
        shell: bash
        run: |
          {
            echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
            echo "GO_MUTANTS_TEST_KEEP=1"
            echo "GO_MUTANTS_TEST_KEEP_DIR=$RUNNER_TEMP/go-mutants-kept"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.13
          sha256: >-
            94c45523c7b6760b7da704f16051171ca32e8447a849a02266a439a4455e9a12
          install_args: go rust cargo:ocomment jq
          cache: true
      - run: mise run test-race
      - name: The corpus is unchanged
        if: success() || failure()
        run: mise run check-corpus
      - name: Upload what the failed tests kept
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kept-scratch-race
          path: ${{ runner.temp }}/go-mutants-kept
          retention-days: 7
          if-no-files-found: ignore

  artifacts:
    needs: [quality]
    if: >-
      needs.quality.outputs.release == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.13
          install_args: go rust goreleaser jq
          cache: true
      - run: mise run release-assets-check
      - run: mise run package
      - name: Upload the snapshot artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-snapshot
          path: dist/
          retention-days: 7
          if-no-files-found: error

  action-smoke:
    needs: [quality]
    if: >-
      needs.quality.outputs.action == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.13
          install_args: go jq
          cache: true
      - name: Build the go-mutants under test and put it on PATH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/go-mutants" ./cmd/go-mutants
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - id: measured
        uses: ./.github/actions/go-mutants
        with:
          version: skip
          working-directory: fixtures/killable
          report: ${{ runner.temp }}/killable-report.json
          fail: "false"
      - name: The outputs are there and agree with each other
        shell: bash
        env:
          STATUS: ${{ steps.measured.outputs.status }}
          TOTAL: ${{ steps.measured.outputs.total }}
          KILLED: ${{ steps.measured.outputs.killed }}
          SURVIVED: ${{ steps.measured.outputs.survived }}
          TIMED_OUT: ${{ steps.measured.outputs.timed-out }}
          SCORE: ${{ steps.measured.outputs.score }}
          EXIT_CODE: ${{ steps.measured.outputs.exit-code }}
          REPORT: ${{ steps.measured.outputs.report }}
        run: |
          set -euo pipefail
          test "$STATUS" = completed
          test -s "$REPORT"
          test "$TOTAL" -gt 0
          test "$SURVIVED" -gt 0
          # The total the action reported is the total the document holds,
          # which is the one number that proves the outputs were read from the
          # report rather than scraped off the console.
          jq -e --argjson t "$TOTAL" \
            '.summary.total == $t' "$REPORT" > /dev/null
          test $((KILLED + SURVIVED + TIMED_OUT)) -le "$TOTAL"
          # A score is a number. An empty one means the run scored nothing,
          # which a fixture with ten mutants did not do.
          case "$SCORE" in
            '' | *[!0-9.]*)
              echo "::error::score is not a number: $SCORE"
              exit 1
              ;;
          esac
          # The exit code is an output whatever `fail` was set to, and a run
          # with an unexpected survivor is a policy failure rather than a
          # broken run.
          test "$EXIT_CODE" = 0 || test "$EXIT_CODE" = 1
          echo "action outputs: $STATUS $TOTAL/$KILLED/$SURVIVED score $SCORE"

  ci-success:
    needs:
      - quality
      - checks
      - platform-tests
      - race
      - artifacts
      - action-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every selected check succeeded
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE_SELECTED: ${{ needs.quality.outputs.code }}
          NATIVE_SELECTED: ${{ needs.quality.outputs.native }}
          RELEASE_SELECTED: ${{ needs.quality.outputs.release }}
          ACTION_SELECTED: ${{ needs.quality.outputs.action }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          jq -e --arg code "$CODE_SELECTED" --arg native "$NATIVE_SELECTED" \
            --arg release "$RELEASE_SELECTED" --arg action "$ACTION_SELECTED" \
            --arg event "$EVENT_NAME" '
            def expected($selected):
              if $selected == "true" or $event == "workflow_dispatch"
              then "success" else "skipped" end;
            ([$code, $native, $release, $action] |
              all(. == "true" or . == "false")) and
            .quality.result == "success" and
            (.checks.result == expected($code)) and
            (."platform-tests".result == expected($native)) and
            (.race.result == expected($native)) and
            (.artifacts.result == expected($release)) and
            (."action-smoke".result == expected($action))
            ' <<< "$RESULTS"

  required:
    name: required
    if: always()
    needs: [ci-success]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the aggregate to succeed
        env:
          RESULT: ${{ needs['ci-success'].result }}
        run: test "$RESULT" = success
