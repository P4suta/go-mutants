---
# SPDX-FileCopyrightText: 2026 go-mutants contributors
# SPDX-License-Identifier: MIT OR Apache-2.0

name: Release

"on":
  push:
    tags: ["v*"]

permissions:
  contents: read

# A release must never be cancelled by a second tag push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Replays the local gates against the tagged tree, and refuses a tag the
  # source does not claim. Nothing is published unless this job is green.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      # The binary's version is stamped at link time from the tag, so nothing
      # downstream would ever notice a tag that disagrees with the source. This
      # is the one place that can: internal/cli.Version is the development
      # version of the release being cut, and a `v0.2.0` tag on a tree that
      # still says `0.1.0-dev` is a mistake, not a release.
      - name: The tag and internal/cli.Version must agree
        shell: bash
        run: |
          printed=$(mise exec -- go run ./cmd/go-mutants --version)
          source=${printed#go-mutants }
          source=${source%-dev}
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" = "$source" ] || [ "${tag#"$source"-}" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME matches internal/cli.Version $source"
          else
            echo "::error::tag $GITHUB_REF_NAME does not match" \
              "internal/cli.Version ($source): bump the source or fix the tag"
            exit 1
          fi
      - run: mise run check
      - run: mise run dogfood

  # The only job with write access, and it only drafts: goreleaser is
  # configured with `release.draft: true`, so the artifacts are uploaded and
  # the release stays unpublished. Pressing publish is a human decision made
  # against docs/release-checklist.md.
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # goreleaser derives the version from the tag and the changelog from
        # the range since the previous one; both need the full history.
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      # The same .goreleaser.yaml `mise run package` exercises on every push,
      # without --snapshot: the version now comes from the tag rather than from
      # snapshot.version_template, and the draft release is created.
      - name: goreleaser release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- goreleaser release --clean
      # A build that reached GitHub is also kept where the workflow run can
      # find it, so a draft deleted by mistake does not mean rebuilding.
      - name: Upload the release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
