name: Release

"on":
  push:
    tags: ["v*"]

permissions:
  contents: read

# A release must never be cancelled by a second tag push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Replays the local gates against the tagged tree. Nothing is published
  # unless this job is green.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          install: true
          cache: true
      - run: mise run check
      - run: mise run dogfood

  # The only job with write access, and it only drafts. Publishing stays a
  # human decision made against docs/release-checklist.md.
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          install: true
          cache: true
      - run: mise run package
      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag
          --title "go-mutants $GITHUB_REF_NAME" --generate-notes

# `mise run package` is still a placeholder. The goreleaser configuration,
# checksums, SBOMs, and artifact upload land in the packaging phase; until
# then this workflow proves the gates and the draft path only.
