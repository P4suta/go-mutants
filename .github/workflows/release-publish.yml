---
# SPDX-FileCopyrightText: 2026 go-mutants contributors
# SPDX-License-Identifier: MIT OR Apache-2.0

name: Publish release

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing vX.Y.Z tag for a retry; leave empty for a new release
        required: false
        type: string

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: release
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - id: release
        if: inputs.tag == ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # yamllint disable-line rule:line-length
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          skip-github-release: false

      - name: Require a release on a new publish run
        if: inputs.tag == '' && steps.release.outputs.release_created != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "release-please did not create a release;" >&2
          echo "merge the Release PR first" >&2
          exit 1

      - id: target
        name: Resolve and validate release tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${RELEASE_TAG}}"
          tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'
          if [[ ! "$tag" =~ $tag_pattern ]]; then
            echo "invalid release tag: ${tag}" >&2
            exit 1
          fi
          version="${tag#v}"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Checkout the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ steps.target.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source version matches the release tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          test "$version" = "$RELEASE_VERSION"
          grep -q "defaultVersion = \"$RELEASE_VERSION\"" internal/cli/root.go

      - name: Require an unpublished draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft \
            | jq --exit-status '.isDraft == true'

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true

      - run: mise run check
      - run: mise run test-integration
      - run: mise run dogfood

      - name: The gates must leave the tagged tree clean
        shell: bash
        run: |
          set -euo pipefail
          dirt="$(git status --porcelain)"
          if [ -n "$dirt" ]; then
            echo "::error::the gates modified the tagged tree; goreleaser" \
              "will not release from a dirty checkout"
            echo "$dirt" >&2
            exit 1
          fi

      - name: goreleaser release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise exec -- goreleaser release --clean

      - name: Upload verified distribution files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: >-
          mise exec -- cargo run --locked
          --manifest-path tools/release-assets/Cargo.toml --
          upload-draft --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          --artifacts dist --distribution-only --allow-other-assets

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - id: prepare
        name: Restore or create verified distribution evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: >-
          mise exec -- cargo run --locked
          --manifest-path tools/release-assets/Cargo.toml --
          prepare-evidence --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          --artifacts dist --output "$GITHUB_OUTPUT"

      - id: attest
        if: steps.prepare.outputs.attestation_reused != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: dist/checksums.txt

      - name: Retain the GitHub attestation bundle
        if: steps.prepare.outputs.attestation_reused != 'true'
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" dist/github-attestation.sigstore.json

      - name: Verify distribution provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: >-
          mise exec -- cargo run --locked
          --manifest-path tools/release-assets/Cargo.toml --
          verify-attestation --repo "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG" --artifacts dist

      - name: Upload signatures and attestation to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        shell: bash
        run: |
          mise exec -- cargo run --locked \
            --manifest-path tools/release-assets/Cargo.toml -- \
            upload-draft --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --asset dist/*.tar.gz dist/*.zip \
            dist/checksums.txt dist/*.sigstore.json

      - name: Publish the complete draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: >-
          gh release edit "$RELEASE_TAG" --draft=false
          --tag "$RELEASE_TAG" --verify-tag
