---
# SPDX-FileCopyrightText: 2026 go-mutants contributors
# SPDX-License-Identifier: MIT OR Apache-2.0

name: Nightly fuzz and property

"on":
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The same rule CI states, and nightly needs it just as much: a runner whose
  # toolchain went missing must fail rather than quietly narrow the suite to the
  # tests that need none. It is easier to miss here, because nobody watches a
  # scheduled job the way they watch a pull request -- a fuzz run that skipped
  # every target for a week looks exactly like a fuzz run that found nothing.
  GO_MUTANTS_TEST_REQUIRE_TOOLS: "1"

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # One matrix entry per fuzz target the repository actually has. `go test
  # -fuzz` fuzzes exactly one target and refuses a pattern that matches
  # several, so the target and its package travel together in the same entry.
  # A matrix rather than three sequential steps because the budgets then
  # overlap: three five-minute searches cost five minutes, not fifteen.
  fuzz:
    name: fuzz ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The strict TOML decoder: every malformed document has to come back
          # as an error with a position, never a panic and never a silently
          # accepted key.
          - target: FuzzParse
            package: ./internal/config
          # Pattern matching, where a pathological glob must not backtrack into
          # a hang.
          - target: FuzzMatch
            package: ./internal/glob
          # The statement flattener, which rewrites real Go source. This is the
          # target that matters most: its output has to parse and mean the same
          # thing as its input.
          - target: FuzzFlatten
            package: ./internal/instrument
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The suites' child `go` commands key their entries on absolute paths that
      # exist for one run, so the cache they fill is rubble by the time the job
      # ends. Same rule as CI: the runner's own temporary area, never restored
      # from an actions cache, published through $GITHUB_ENV because the
      # `runner` context is not available in a job's `env:`.
      #
      # Keeping is on for the same reason as in CI, and it is worth more here:
      # nobody is watching a scheduled run, so what a failed test left is the
      # only account of it there will ever be. `1` is keep-on-failure, so a
      # green night leaves nothing behind.
      - name: Point the test build cache and the kept scratch at the runner
        shell: bash
        run: |
          {
            echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
            echo "GO_MUTANTS_TEST_KEEP=1"
            echo "GO_MUTANTS_TEST_KEEP_DIR=$RUNNER_TEMP/go-mutants-kept"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      # -run='^$' keeps the package's ordinary tests out of the budget: the
      # five minutes belong to the fuzzer, and the unit suite already ran in
      # CI on the commit this schedule is fuzzing.
      - name: Fuzz for five minutes
        run: >-
          mise exec -- go test -run='^$' -fuzz='^${{ matrix.target }}$'
          -fuzztime=5m ${{ matrix.package }}
      # The same gate as CI's platform-tests job, and for the same reason: the
      # corpus is an input, and a suite that wrote where it reads cannot be
      # trusted to have noticed. Nobody is watching a scheduled run, so a
      # fixture a nightly suite edited would otherwise be found by whoever next
      # ran `git status`. The reasoning behind `--ignored`, the condition and
      # the printed listing is written out once, in ci.yml.
      - name: The corpus is unchanged
        if: success() || failure()
        shell: bash
        run: |
          changed="$(git status --porcelain --ignored -- fixtures)"
          if [ -n "$changed" ]; then
            echo "::error::the test suite wrote into fixtures/:"
            echo "$changed"
            exit 1
          fi
      # A crasher is the entire point of the job. `go test -fuzz` writes the
      # failing input into the package's testdata/fuzz directory, which dies
      # with the runner unless it is collected here.
      - name: Collect the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-crasher-${{ matrix.target }}
          path: internal/*/testdata/fuzz/**
          retention-days: 14
          if-no-files-found: warn
      # What the failed tests left behind, off the runner and into an artifact,
      # exactly as in CI: one directory per failed test, with the account of
      # what it ran, the source it dumped and the recording of what it executed.
      # Nobody is watching a scheduled run, so this is all a failure leaves.
      - name: Upload what the failed tests kept
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kept-scratch-fuzz-${{ matrix.target }}
          path: ${{ runner.temp }}/go-mutants-kept
          retention-days: 14
          if-no-files-found: ignore

  # The pgregory.net/rapid suites: the flattener's
  # `parse(flattened) ≡ parse(patched original)` invariant, the interval
  # forest's containment and traversal laws, and shard assignment.
  #
  # Two independent boosts, because they widen different things. RAPID_CHECKS
  # deepens one search -- rapid's own case budget, 100 by default so that
  # `mise run test` stays a few seconds. It is a job-level variable rather
  # than a flag because rapid reads it with os.LookupEnv in its own init()
  # (engine.go) and makes it the default for -rapid.checks, so it reaches
  # every test binary this step builds without threading a flag through mise.
  # -count reruns the whole suite, and since rapid draws a fresh random seed
  # per run unless -rapid.seed or RAPID_SEED pins one, each rerun explores
  # from somewhere else entirely.
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAPID_CHECKS: "2000"
    steps:
      # As in the fuzz job above: the test cache lives in the runner's own
      # temporary area and dies with it.
      - name: Point the test build cache and the kept scratch at the runner
        shell: bash
        run: |
          {
            echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
            echo "GO_MUTANTS_TEST_KEEP=1"
            echo "GO_MUTANTS_TEST_KEEP_DIR=$RUNNER_TEMP/go-mutants-kept"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      # The per-package alarm is stated because 2000 checks x 5 runs is a long
      # way past the ten minutes go test defaults to, and a budget overrun
      # reported as a panic reads like a hang in the code under test.
      - name: Property suites, deepened and repeated
        run: >-
          mise exec -- go test -count=5 -timeout=40m
          ./internal/instrument/... ./internal/interval/...
          ./internal/mutation/...
      # The same gate as CI's platform-tests job, and for the same reason: the
      # corpus is an input, and a suite that wrote where it reads cannot be
      # trusted to have noticed. Nobody is watching a scheduled run, so a
      # fixture a nightly suite edited would otherwise be found by whoever next
      # ran `git status`. The reasoning behind `--ignored`, the condition and
      # the printed listing is written out once, in ci.yml.
      - name: The corpus is unchanged
        if: success() || failure()
        shell: bash
        run: |
          changed="$(git status --porcelain --ignored -- fixtures)"
          if [ -n "$changed" ]; then
            echo "::error::the test suite wrote into fixtures/:"
            echo "$changed"
            exit 1
          fi
      # rapid persists a shrunk failing case next to the suite that found it.
      # Same reasoning as the fuzz corpus above: collect it or lose it.
      - name: Collect the shrunk failing case
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rapid-failures
          path: internal/*/testdata/rapid/**
          retention-days: 14
          if-no-files-found: warn
      # What the failed tests left behind, off the runner and into an artifact,
      # exactly as in CI: one directory per failed test, with the account of
      # what it ran, the source it dumped and the recording of what it executed.
      # Nobody is watching a scheduled run, so this is all a failure leaves.
      - name: Upload what the failed tests kept
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kept-scratch-property
          path: ${{ runner.temp }}/go-mutants-kept
          retention-days: 14
          if-no-files-found: ignore

  # The integration tier under the race detector: the pairing that finds what
  # neither half finds alone.
  #
  # CI's `race` job covers the unit tier on every push, and the races that
  # matter most in this repository are not there. They are in the scheduler that
  # runs mutants concurrently, the copier that fans a snapshot out over
  # goroutines, and the supervisor that kills a process tree while its output is
  # still being read -- none of which runs without a real toolchain.
  # Instrumented, that suite is the better part of an hour, which is why it is
  # here rather than in front of a pull request.
  #
  # Ubuntu only, for the same reason CI's race job is: -race links the C
  # runtime, and a data race is a property of the Go code rather than of the
  # platform.
  #
  # 100 minutes against the task's own 90m alarm, so that a suite which ran out
  # of budget reports itself -- with the package that hung and a stack -- in the
  # ten minutes before the runner cancels the job and says nothing.
  race-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      # The suites' child `go` commands key their entries on absolute paths that
      # exist for one run, and an instrumented run compiles everything twice
      # over. Same rule as CI: the runner's own temporary area, never restored
      # from an actions cache, published through $GITHUB_ENV because the
      # `runner` context is not available in a job's `env:`.
      - name: Point the test build cache and the kept scratch at the runner
        shell: bash
        run: |
          {
            echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
            echo "GO_MUTANTS_TEST_KEEP=1"
            echo "GO_MUTANTS_TEST_KEEP_DIR=$RUNNER_TEMP/go-mutants-kept"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      - run: mise run test-integration-race
      # The same gate as CI's platform-tests job, and for the same reason: the
      # corpus is an input, and a suite that wrote where it reads cannot be
      # trusted to have noticed. Nobody is watching a scheduled run, so a
      # fixture a nightly suite edited would otherwise be found by whoever next
      # ran `git status`. The reasoning behind `--ignored`, the condition and
      # the printed listing is written out once, in ci.yml.
      - name: The corpus is unchanged
        if: success() || failure()
        shell: bash
        run: |
          changed="$(git status --porcelain --ignored -- fixtures)"
          if [ -n "$changed" ]; then
            echo "::error::the test suite wrote into fixtures/:"
            echo "$changed"
            exit 1
          fi
      # As in CI: a report, never a gate.
      - name: Test build cache
        if: success() || failure()
        continue-on-error: true
        run: mise run test-cache-status
      # What the failed tests left behind, off the runner and into an artifact,
      # exactly as in CI: one directory per failed test, with the account of
      # what it ran, the source it dumped and the recording of what it executed.
      # Nobody is watching a scheduled run, so this is all a failure leaves.
      - name: Upload what the failed tests kept
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kept-scratch-race-integration
          path: ${{ runner.temp }}/go-mutants-kept
          retention-days: 14
          if-no-files-found: ignore

  # The benchmarks, kept.
  #
  # A benchmark number is worth nothing on its own and everything next to
  # yesterday's: `benchstat` over two of these files is how a regression in the
  # glob matcher, the TOML parser or the snapshot copier is seen at all. Nightly
  # rather than per-push because a shared runner's timings are too noisy to gate
  # on and because there is nothing to compare a pull request's number with.
  #
  # It is a report, so a failure here is a thing to read rather than a thing to
  # block on -- but the upload runs `if: always()` regardless, since a benchmark
  # that panicked halfway still wrote the lines before it.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # As in the fuzz job above: the test cache lives in the runner's own
      # temporary area and dies with it.
      - name: Point the test build cache at the runner's temporary directory
        shell: bash
        run: >-
          echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
          >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      - run: mise run bench
      # The same gate as CI's platform-tests job. `always()` because nobody is
      # watching a scheduled run, so a fixture a nightly job edited would
      # otherwise be found by whoever next ran `git status`.
      - name: The corpus is unchanged
        if: always()
        shell: bash
        run: |
          changed="$(git status --porcelain --ignored -- fixtures)"
          if [ -n "$changed" ]; then
            echo "::error::the test suite wrote into fixtures/:"
            echo "$changed"
            exit 1
          fi
      - name: Upload the benchmark output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bench
          path: bench.txt
          retention-days: 14
          if-no-files-found: warn
