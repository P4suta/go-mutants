---
# SPDX-FileCopyrightText: 2026 go-mutants contributors
# SPDX-License-Identifier: MIT OR Apache-2.0

name: Manual deep verification

"on":
  workflow_dispatch:
    inputs:
      check:
        description: Verification to run
        type: choice
        required: true
        default: bench
        options:
          - fuzz
          - property
          - race-integration
          - dogfood-audit
          - dogfood-runner
          - bench

permissions:
  contents: read

env:
  GO_MUTANTS_TEST_REQUIRE_TOOLS: "1"

concurrency:
  group: manual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Validate the requested verification
        env:
          CHECK: ${{ inputs.check }}
        run: >-
          jq -en --arg check "$CHECK"
          '$check | IN("fuzz", "property", "race-integration",
          "dogfood-audit", "dogfood-runner", "bench")'

  fuzz:
    needs: [selection]
    if: inputs.check == 'fuzz'
    name: fuzz ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzParse
            package: ./internal/config
          - target: FuzzMatch
            package: ./internal/glob
          - target: FuzzFlatten
            package: ./internal/instrument
          - target: FuzzParseTextfmt
            package: ./internal/coverage
          - target: FuzzParseDiff
            package: ./internal/gitdiff
          - target: FuzzValidate
            package: ./internal/schemas
          - target: FuzzMutantIdentity
            package: ./internal/mutation
          - target: FuzzBuild
            package: ./internal/interval
          - target: FuzzParseVersion
            package: ./internal/gocmd
          - target: FuzzParseDiagnostics
            package: ./internal/validate
          - target: FuzzReadRecording
            package: ./trace
          - target: FuzzParseDocument
            package: ./internal/report
          - target: FuzzParseShardSpec
            package: ./internal/report
          - target: FuzzMatchAgreesWithTheFlagPackage
            package: ./internal/testflag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Point the test build cache and the kept scratch at the runner
        shell: bash
        run: |
          {
            echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
            echo "GO_MUTANTS_TEST_KEEP=1"
            echo "GO_MUTANTS_TEST_KEEP_DIR=$RUNNER_TEMP/go-mutants-kept"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.13
          install_args: go jq
          cache: true
      - name: Fuzz for five minutes
        run: >-
          mise exec -- go test -run='^$' -fuzz='^${{ matrix.target }}$'
          -fuzztime=5m ${{ matrix.package }}
      - name: The corpus is unchanged
        if: success() || failure()
        run: mise run check-corpus
      - name: Collect the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-crasher-${{ matrix.target }}
          path: internal/*/testdata/fuzz/**
          retention-days: 7
          if-no-files-found: warn
      - name: Upload what the failed tests kept
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kept-scratch-fuzz-${{ matrix.target }}
          path: ${{ runner.temp }}/go-mutants-kept
          retention-days: 7
          if-no-files-found: ignore

  property:
    needs: [selection]
    if: inputs.check == 'property'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAPID_CHECKS: "2000"
    steps:
      - name: Point the test build cache and the kept scratch at the runner
        shell: bash
        run: |
          {
            echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
            echo "GO_MUTANTS_TEST_KEEP=1"
            echo "GO_MUTANTS_TEST_KEEP_DIR=$RUNNER_TEMP/go-mutants-kept"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.13
          install_args: go jq
          cache: true
      - name: Property suites, deepened and repeated
        run: >-
          mise exec -- go test -count=5 -timeout=40m
          ./internal/glob/... ./internal/instrument/... ./internal/interval/...
          ./internal/mutation/...
      - name: The corpus is unchanged
        if: success() || failure()
        run: mise run check-corpus
      - name: Collect the shrunk failing case
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rapid-failures
          path: internal/*/testdata/rapid/**
          retention-days: 7
          if-no-files-found: warn
      - name: Upload what the failed tests kept
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kept-scratch-property
          path: ${{ runner.temp }}/go-mutants-kept
          retention-days: 7
          if-no-files-found: ignore

  race-integration:
    needs: [selection]
    if: inputs.check == 'race-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Point the test build cache and the kept scratch at the runner
        shell: bash
        run: |
          {
            echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
            echo "GO_MUTANTS_TEST_KEEP=1"
            echo "GO_MUTANTS_TEST_KEEP_DIR=$RUNNER_TEMP/go-mutants-kept"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.13
          install_args: go rust cargo:ocomment jq
          cache: true
      - run: mise run test-integration-race
      - name: The corpus is unchanged
        if: success() || failure()
        run: mise run check-corpus
      - name: Test build cache
        if: success() || failure()
        continue-on-error: true
        run: mise run test-cache-status
      - name: Upload what the failed tests kept
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kept-scratch-race-integration
          path: ${{ runner.temp }}/go-mutants-kept
          retention-days: 7
          if-no-files-found: ignore

  dogfood-audit:
    needs: [selection]
    if: inputs.check == 'dogfood-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.13
          install_args: go jq
          cache: true
      - run: mise run dogfood-audit

  dogfood-runner:
    needs: [selection]
    if: inputs.check == 'dogfood-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Point the test build cache at the runner's temporary directory
        shell: bash
        run: >-
          echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
          >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.13
          install_args: go rust cargo:ocomment jq
          cache: true
      - name: The report the last run left
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          gh run download --repo "$GITHUB_REPOSITORY" \
            --name assurance-report-full \
            --dir "$RUNNER_TEMP/previous" || true
          ls -l "$RUNNER_TEMP/previous" || true
      - run: mise run dogfood-runner
      - name: Keep this run's report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assurance-report-full
          path: goatest/.goatest/latest-full.json
          if-no-files-found: warn
          retention-days: 7
      - name: What moved since the last run
        if: always()
        shell: bash
        run: |
          before="$RUNNER_TEMP/previous/latest-full.json"
          after="goatest/.goatest/latest-full.json"
          if [ ! -f "$before" ] || [ ! -f "$after" ]; then
            echo "nothing to compare: first measurement, or no report"
            exit 0
          fi
          mise run report-diff -- "$before" "$after" || true

  bench:
    needs: [selection]
    if: inputs.check == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Point the test build cache at the runner's temporary directory
        shell: bash
        run: >-
          echo "GO_MUTANTS_TEST_GOCACHE=$RUNNER_TEMP/go-mutants-gocache"
          >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.13
          install_args: go jq
          cache: true
      - run: mise run bench
      - name: The corpus is unchanged
        if: always()
        run: mise run check-corpus
      - name: Upload the benchmark output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bench
          path: bench.txt
          retention-days: 7
          if-no-files-found: warn
