version: "2"

linters:
  default: standard
  settings:
    govet:
      enable:
        - shadow
    staticcheck:
      checks:
        - all

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
