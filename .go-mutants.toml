# index, of merge and of relativeTo and change no answer Map gives, so a test
# written through Map could not reach them. See CHANGELOG.md.
#
# What is left is one comparator's secondary key, mutated two ways. Both rows
# make the same argument and it is a proof rather than a shrug: the key orders
# only intervals that already share a start line, and merge folds any run of
# those into one interval reaching the furthest of their ends whatever order the
# sort leaves them in -- so no permutation of a tie changes the merged list, and
# covers reads nothing else. Neither row is uncovered: a case in map_test.go
# gives one file two blocks opening on one line, so the line runs and the
# mutants are executed and reported as survivors rather than skipped.

