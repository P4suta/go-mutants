# internal/schemas, whose 89 mutants brought seven rows, and all seven are one
# claim: an embedded schema that cannot be used. `schema.FS` is an embed.FS
# fixed at build time, so what it holds is a fact about the binary rather than
# about anything a caller does -- there is no input, no flag and no file on disk
# that can make ReadFile fail, make the bytes stop being JSON, make AddResource
# refuse the "$id", or make Compile reject the schema.
#
# That is not taken on trust either. TestEveryRegisteredSchemaCompiles is the
# negation of all seven, asserted on every run of the suite: for every
# registered document type it reads the file out of the embedded FS and then
# validates `{}` against it, requiring the failure to be GOM5003 rather than
# GOM5004 -- which is only true if the file read, parsed, registered, compiled,
# and was found in the compiled map. So the day one of these branches becomes
# reachable is a day that test is already red, and these rows go stale with it.
#
# The guards stay because they are what makes a broken schema take down one
# report format instead of the whole run, which is stated in CodeSchemaUnusable's
# own documentation. Every other survivor this package first reported is dead:
# seven named tests kill fourteen of them, including the second and third sort
# keys of firstViolation, which needed a trace event carrying somebody else's
# payload to produce two violations at one location.

