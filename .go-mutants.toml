[test]
# An argv vector, never a shell string. Scoped to the seventeen packages the mutated
# files live in, which is what the baseline proves before any mutant runs. The
# list has to track `include` above line for line: a package whose files are
# mutated but whose suite is not named here has no binary covering it, so every
# mutant in it is reported `survived (uncovered)` and the gate measures the
# scope's silence rather than its tests.
#
# This line is the whole reason the scope above could grow at all. go-mutants
# reads a `test.command` that is `go test` followed only by package patterns as
# a *scope*: it builds a test binary for those packages and for no others, and
# every mutant is measured against that set.
# Before, `internal/execute` listed `./...` whatever the command said, so naming
# a command here bought a fast baseline and then ran the whole module's binaries
# against every mutant -- in import-path order, until one failed, with
# internal/discover's toolchain-driving suite sitting sixth. That was the
# measured minute per mutant this file used to be sized against.
#
# Being read also turns coverage-guided selection on, where it used to be
# reserved for the built-in `go test ./...`. A mutant no binary in this scope
# reaches is reported as `survived (uncovered)` without a process being started
# for it, which is the honest reading of a scope that leaves the line out.
#
# One optimisation is still given up here, and the run says so rather than
# degrading quietly:
#
#   GOM7901  the outcome cache reuses nothing, because cache.mode "auto" only
#            trusts the built-in command. That rule is about whether go-mutants
#            can reason about a command's reproducibility rather than about
#            whether it can read its scope, and the two have not been aligned
#            yet. Setting mode = "on" would promise reproducibility and get the
#            cache; this gate does not need it.
#
# GOM7601 is no longer among them, which is the change worth recording: this
# command is one go-mutants understands, so coverage guidance is on.
#
# Nothing here has to say anything about vet, and that is also a change worth
# recording. The instrumented snapshot is generated code in which every mutant
# of an expression is spliced in beside the original, so `x == "." && x == ".."`
# is a normal shape there -- and `go test` runs vet's `bools` analyzer by
# default and rejects it, which used to stop a run at GOM4013 (the snapshot
# fails its own tests unmutated) or GOM7505 (a test binary would not build).
# `mise run dogfood` worked around it by exporting GOFLAGS=-vet=off over the
# whole run. The engine now handles it: it merges `-vet=off` into GOFLAGS for
# the two commands issued against the instrumented tree -- the instrumented
# baseline and the per-package `go test -c` -- and for nothing else, so the
# pristine baseline below still runs `command` with vet at its default and a
# genuine `bools` finding in this repository's source still fails the run.
#
# `mise run dogfood` does still export RAPID_SEED=1, and running go-mutants
# against this file by hand without it is running a slightly different gate.
# internal/interval's suite is a pgregory.net/rapid property suite, rapid draws
# a fresh random seed per process unless one is pinned, and an unpinned seed
# makes the score -- and so the minimum_score floor below -- vary between runs
# of an unchanged tree.
command = [
  "go",
  "test",
  "./internal/mutation/...",
  "./internal/glob/...",
  "./internal/interval/...",
  "./internal/testflag/...",
  "./internal/operatorselect/...",
  "./internal/drift/...",
  "./internal/coverage/...",
  "./internal/schemas/...",
  "./internal/config/...",
  "./internal/gocmd/...",
  "./internal/report/...",
  "./internal/testlog/...",
  "./internal/tempowner/...",
  "./internal/gitdiff/...",
  "./internal/snapshot/...",
  "./internal/cache/...",
  "./internal/validate/...",
]
# Deliberately omitted, where this file used to pin 180s. The old number was
# derived from a fact that scoping has deleted: the timeout had to clear
# internal/discover's binary, which drives the real Go toolchain for about a
# minute and which every mutant used to run. That binary is not built any more.
# What is left is max(10s, slowest baseline × 5) over a scoped baseline that
# measures in seconds, bounding test binaries that measure in fractions of one,
# and a derived bound moves with the machine instead of being a number somebody
# has to remember to re-measure.
#
# `memory` is omitted for the same reason, and it matters more here than the
# timeout does, because this scope is what made the setting exist. Four of
# internal/config's mutants allocate while failing to return, and one of them
# took a GitHub runner down before there was a bound to stop it. A derived
# max(1GiB, largest baseline peak x 4) is what this file wants, because the peak
# it is derived from is this repository's own suite rather than a number
# somebody guessed; what it resolves to on this scope is recorded under [policy].
baseline_runs = 3

[execution]
# Pinned so that a developer's run and a GitHub-hosted CI run are the same run,
# and so the wall clock quoted under [policy] means something on both. It is no
# longer pinned for correctness: the old reason was that every mutant ran the
# whole module's binaries, several of which drive the real Go toolchain, so the
# default of min(NumCPU, 8) meant eight concurrent toolchains and completed no
# mutants in ten minutes. With the scope above a mutant runs one or two fast
# unit-test binaries, and the default would simply be quicker on a large
# machine. Four is what a GitHub-hosted runner resolves to.
jobs = 4

[cache]
# auto reuses proven outcomes keyed by tool version, executable digest,
# workspace digest, catalog digest, command, the timeout as configured, and
# GOFLAGS/GOOS/GOARCH -- and reuses nothing at all when test.command is not the
# built-in `go test ./...`, because go-mutants cannot reason about a command it
# did not write. That is this file's own situation; see GOM7901 above. Left at
# auto rather than "on" because promising that a command is reproducible is a
# promise, and this gate does not need it.
mode = "auto"
# directory = "team-cache"

[policy]
# strict stays false in the file on purpose: the gate belongs to the caller.
# `mise run dogfood` and the CI job that runs it pass --strict, so a developer
# who wants to look at a survivor rather than be failed by it just runs
# `go-mutants run`. That is not the same as a run that cannot fail: the floor
# below is compared on every run, --strict or not, and the note there says
# where each of the two gates actually bites.
strict = false
# Measured, not wished for. The scope catalogues 4396 mutants. Four thousand
# three hundred and twenty-one are detected -- 4318 killed and three caught by
# a counted loop -- and the other seventy-five are the rows declared above,
# which leave the denominator rather than counting against it, so the measured
# score is 100.00%, with all seventy-five expectations fulfilled and none stale.
# Twenty-seven of those seventy-five are uncovered: the profiling pass reaches
# 4369 of the 4396, and every one it does not is a row above that says why.
# Every one of those numbers
# was the same on four of the five runs that measured the seventy-seven-row
# ancestor of this scope, the killed/timeout split included; the fifth, taken
# while the machine picked up other work, reported two of the kills as
# `inconclusive`, and what that means is written under the pairs below.
#
# The bound itself is derived and worth quoting, because it is the one number
# here that is a fact about this repository's own suite rather than about the
# catalogue -- `go-mutants run -v` prints it:
#
#   memory: baseline peak 171.4 MiB, bound 1.0 GiB (derived)
#
# 171.4 MiB x 4 is 686 MiB, so the 1 GiB floor is still what applies and the
# bound is about six times what the unmutated suite needs. The peak moved with
# the eleventh package -- internal/report's suite writes and reads whole
# documents -- and again with the thirteenth, and the bound did not either
# time, because the floor was always the larger of the two.
# Nothing legitimate is close to it; the two mutants it stops reach 1.1 GiB in
# about a second and a half, which is the difference between a bound that
# catches runaways and one that fails honest tests.
#
# The peak is the one figure here that is not the same twice, and it is quoted
# as one reading rather than as a constant: three -v runs of the ten-package
# scope read 141.5, 141.9 and 147.4 MiB, where the nine-package scope beside
# them read 125.2 MiB, the twelve-package scope read 157.5 MiB, the
# thirteen-package one 174.2 MiB, the fourteen-package one 168.5 MiB, the
# fifteen-package one 168.7 MiB, the sixteen-package one 169.1 MiB and this one
# 171.4 MiB -- five scopes that grew and a peak that did not, which is what
# "one reading" means. Adding a suite that starts processes is what moved it. It moves the
# bound not at all -- four times any of those is still under the 1 GiB floor --
# which is exactly what a floor is for, and why the tally stayed identical while
# the number the bound is derived from did not.
#
# What each widening cost is a paired measurement rather than a remembered one
# -- the run before it and the run after it, at --jobs 4:
#
#   3 -> 6 packages, back to back on one idle machine
#     warm test-owned build cache   566 mutants in 8.8-9.0s, 600 in 9.9-10.5s
#     cold test-owned build cache   38s either way
#   6 -> 8 packages, on a machine with other work on it
#     warm test-owned build cache   835 mutants in 24-30s over three runs
#     cold test-owned build cache   1m36s and 2m14s
#   8 -> 9 packages, minutes apart on one machine
#     warm test-owned build cache   835 mutants in 24-28s over two runs,
#                                   1260 in 78-79s over three
#     cold test-owned build cache   52s and 1m52s
#   before -> after the memory bound, on the same machine
#     warm test-owned build cache   1260 mutants in 78-79s over three runs,
#                                   1296 in 52-58s over seven
#     cold test-owned build cache   1m52s and 1m48s
#   9 -> 10 packages, interleaved on one shared machine
#     warm test-owned build cache   1296 mutants in 1m07s, 1m29s and 1m33s,
#                                   1402 in 1m28s, 1m33s and 1m38s
#     cold test-owned build cache   2m05s and 3m45s
#   10 -> 11 packages, on one shared machine that was quiet for some of it
#     warm test-owned build cache   2497 mutants in 6m13s and 6m30s with the
#                                   derived timeout at its 10s floor, 8m42s
#                                   and 9m02s when other work moved it
#     cold test-owned build cache   9m31s with the timeout at 38.7s, before the
#                                   engine sized it on the runs after the
#                                   first; about 4m45s on GitHub's ubuntu
#                                   runner after, with the timeout at 10s
#
# The third pair is the one that needed explaining, because 425 more mutants did
# not cost fifty seconds; four more mutants that never return did. A timeout is
# not believed the first time -- the mutant is measured again before the verdict
# is recorded -- so each of those cost two ten-second waits, and the run went
# from one such mutant to five: from 20 seconds of worker time spent waiting to
# 100, on a run whose other 1255 mutants are measured in milliseconds.
#
# The fourth pair is that sentence being acted on. Bounding a mutant's memory
# the way its time is bounded takes the two that allocate out of the waiting
# entirely: they are killed at about 1.1 GiB after a second and a half instead
# of spending two ten-second timeouts each, so the waiting drops from 100
# seconds of worker time to 60 and the wall clock from 78-79s to 52-58s. The
# catalogue grew by 36 in the same step -- `test.memory` and the size vocabulary
# that reads it are themselves mutated now -- so this is 36 more mutants and 25
# fewer seconds, which is the only kind of trade this file is glad to record.
# Cold moved by four seconds, because a cold run is dominated by compiling and
# the waiting was never the whole of it.
#
# Two later warm runs of that scope measured 70s and 78s, and they are named
# here rather than quietly widening the range: the machine had picked up other
# work by then. That is the caveat the second pair above carries, and the
# reason this file keeps saying only the ratios travel -- a range means
# something only while it describes one machine doing one thing. The tally was
# identical on both, which is the number this gate is actually judged on.
#
# The fifth pair is the noisiest of the five and is written out anyway, because
# a measurement taken on a shared machine is still a measurement and a
# remembered number from a different one is not a comparison. Both halves were
# measured minutes apart, interleaved, on the machine that widened the scope;
# neither half is comparable with the rows above it, which is why the
# nine-package figures there (52-58s warm, 1m48s cold) and here (1m07-1m33s
# warm, 2m05s cold) are the same scope and different machines.
#
# Warm, the two halves overlap, and the back-to-back pair is the one to read:
# 1m32.8s for 1296 mutants, then 1m28.3s for 1402. The derived timeout was at
# its 10s floor on both sides, so the three mutants that never return cost the
# same 60 seconds of worker time in each, and 106 more mutants cost about what
# 106 fast mutants cost.
#
# Cold is where the widening is visible, and the cause is the derived timeout
# rather than the catalogue. Cold, the first of the three baseline runs is the
# one doing the compiling, so max(10s, slowest baseline x 5) is set by a build
# and not by a test: the tenth package took that run from 4.0s to 5.5s, and the
# timeout from 20.1s to 27.7s with it. Three mutants wait that out twice each,
# which is 45 more seconds of worker time and a longer serial tail at the end,
# when they are all that is left to finish. That is most of 2m05s -> 3m45s, and
# it is a cost that shrinks on a machine whose cold compile is faster rather
# than a cost that is 106 mutants.
#
# Two further warm runs of the ten-package scope measured 2m39.6s and 2m47.5s,
# and they are named for the same reason the 70s and 78s above are: the machine
# had picked up other work, the derived timeout read 18.1s and 20.3s instead of
# the floor, and the three that wait paid the difference twice each. The tally
# was identical on both, which is the number this gate is actually judged on.
#
# The first pair is clean, the second is not, and saying so is still the point.
# Thirty-four more mutants cost about a second warm and nothing at all cold,
# because a cold run is dominated by compiling the module and its test binaries
# and internal/testflag, internal/operatorselect and internal/drift are 125
# lines between them. The second pair was measured against a loaded machine,
# where the same tree's cold run varied by 38 seconds between two attempts,
# which is why the eight-package cold figure is written as "1m36s and 2m14s"
# there and as a clean 52s in the pair above: the two were measured on different
# machines, months of commits apart, and only the pair is a comparison. Cold is
# what CI measures: the dogfood job points GO_MUTANTS_TEST_GOCACHE at the
# runner's temporary directory and never restores it from an actions cache.
#
# Load is also why the timeout named under [mutation] is not a fixed cost. It is
# max(10s, slowest baseline x 5), which is the 10s floor on the machine that
# measured the first four pairs above, was 29.7s on the loaded one, and read
# 10s, 18.1s, 20.3s and 27.7s across the seven runs of the scope this file now
# describes -- and the three mutants that spin spend two of them each whatever
# else the run has to do. That is the single largest variable in this gate's
# wall clock and it belongs to the machine rather than to the catalogue. The
# memory bound is derived from the same baseline and is not load-bearing in the
# same way: max(1GiB, largest peak x 4) is the 1 GiB floor here and would stay
# the floor until this repository's suite needed 256 MiB.
#
# Only the ratio travels; the absolute numbers are the machine. The scope
# before this one -- eight packages, 835 mutants -- was recorded here as
# 24-30s warm, where the scope before that -- three packages, 566 mutants --
# was 1m10s-1m30s on the machine that measured it, the one before that -- one
# file and two packages, 121 mutants -- took 48-50 seconds, and the one before
# that -- two files, sixteen mutants -- took 7m08s. What does not vary with the
# machine is the tally: 1296 catalogued, 1266 detected, 1263 of them killed and
# three timed out, 30 expected, nine of those never executed at all, on every
# one of the eleven runs that measured that scope. The killed/timeout split is
# part of that tally again rather than an exception to it; the note at the top
# of this file says what it took.
#
# The sixth pair is the eleventh package, and it is the first one the wall
# clock could not be read off the catalogue. Warm, on the 10s floor, the scope
# takes 6m13s and 6m30s: 2497 mutants at four workers, most of them measured in
# under a second, and internal/report's suite -- about half a second a run,
# where the nine-package command was a fifth of that -- is what makes the
# thousand of them that live in it cost what they cost. The two runs beside
# those, 8m42s and 9m02s, are the same tree and the same tally on the same
# machine, and the difference is the other work the machine had picked up:
# one of them derived a 23.6s timeout from a baseline that read 4.7s under
# load, and the four mutants that never return paid that twice each, which is
# three minutes of a nine-minute run spent waiting for a budget the machine
# rather than the suite had set. The other kept the floor and lost its time
# in the runs themselves, and reported two of its 2428 kills as
# `inconclusive`: killed once, timed out on the confirming run, the way a
# suite that is fast in a quiet second and stalls in a loud one looks from
# outside. The tally is the number this gate is judged on, and it was
# identical everywhere but that column.
#
# Cold, the scope takes 9m31s, and more than half of that is one number. The
# first of the three baseline runs is the one that compiles, and cold it
# measured 7.7s where the runs after it measured 2s; max(10s, slowest x 5)
# sized the timeout on the compiling run at 38.7s, and the four mutants that
# never return paid it twice each -- five minutes of worker time waiting for a
# budget no mutant run ever needed, since their binaries are built once
# beforehand. That is the mechanism the fifth pair named at 2m05s -> 3m45s,
# now large enough to be most of the run, and it is answered where it lives
# rather than here: the engine sizes the budget on the runs after the first.
# The first cold run on that engine was CI's own -- GitHub's ubuntu runner,
# this scope, `slowest 138ms` after the compiling first run and the timeout at
# its 10s floor -- and took about 4m45s of a 5m22s job. The 9m31s above is the
# figure the change was made to remove, and it is kept as that.
#
# Whether this scope wants an explicit `test.timeout` was the open question the
# first two runs left, and the measurement answers it for now: on the floor
# the tally is exact, and the two inconclusive kills appeared only under
# outside load that also moved the derived timeout. A number written into
# this file to paper over a loaded machine is the kind of number this file
# exists not to keep, so the floor stays derived.
#
# The floor has moved twice, and the arithmetic is why both times. It is worth being exact about which gate the remaining
# slack belongs to, because the two are independent and only one of them guards
# CI:
#
#   --strict              mutation.Decide fails on UnexpectedSurvivors > 0, so
#                         the first unexpected survivor is exit 1 for the
#                         dogfood task and for CI. There is no headroom on that
#                         gate at all, and none is wanted.
#   minimum_score = 99.75 compared against the measured score whether or not
#                         --strict was passed. Four thousand three hundred and
#                         twenty-one scored mutants are worth 0.023 points each,
#                         so 4311/4321 = 99.77% clears 99.75 and
#                         4310/4321 = 99.74% does not: an ungated
#                         `go-mutants run` reports up to ten survivors and
#                         exits 0, and fails at eleven.
#
# Ninety-six is what stood here while 120 mutants were scored, where it bought
# four survivors of slack. At 544 the same number would buy twenty-one, which is
# a materially weaker backstop wearing a number that had not changed, so it went
# up rather than staying put. Ninety-nine then stayed put through five
# widenings, and that was arithmetic rather than inertia: one percent of 549 is
# 5.49, of 583 is 5.83, of 809 is 8.09 and of 1266 is 12.66, so the slack this
# floor bought went five, five, eight, twelve while the catalogue grew tenfold
# -- always short of the twenty-one that moved the number the last time.
#
# One percent of 2484 is 24.84, which is not short of it. Twenty-four survivors
# is more slack than the twenty-one that was judged too much at 544, so the same
# rule that kept the number at 99 through five widenings is the rule that moved
# it then, and it moved to the value that left the backstop where it had
# actually been: 99.5 bought twelve survivors, where 99 bought thirteen before
# that widening. Ninety-nine and a half then stayed put through five more, and
# that was the same arithmetic reaching the same answer: half a percent of 2822
# was 14.11, of 2943 is 14.71, of 3200 is 16.00, of 3527 is 17.64 and of 3941 is
# 19.71, so the slack went twelve, fourteen, fourteen, sixteen, seventeen,
# nineteen while the scope grew by a third.
#
# Half a percent of 4321 is 21.61, and twenty-one is the number that was judged
# too much at 544 -- so the same rule moves it a second time, to 99.75, which
# leaves the backstop at ten survivors where 99.5 had left it at twelve when it
# was set. The floor is a fixed number of survivors rather than a fixed
# percentage of a growing catalogue, which is what "raise it when the scope
# grows enough to make that count material" meant, and this is the second time
# that sentence has been cashed in rather than repeated.
#
# A fraction is new here and is the only spelling available: the next integer up
# is 100, which is `--strict` under another name, and this floor is deliberately
# the looser of the two gates. It is the backstop for a run that did not ask to
# be gated, never the thing keeping CI honest, and a green CI run is never green
# because of it. Raise it again when the scope grows enough to make that count
# material; do not lower it to accommodate a survivor that a test could kill.
minimum_score = 99.75
require_mutants = true

[report]
directory = "reports/mutation"
formats = ["json", "html"]
# HTML colouring thresholds only; they are independent of [policy].
high = 80
low = 60
