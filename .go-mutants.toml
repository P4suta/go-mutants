[test]
command = [
  "go",
  "test",
  "./internal/mutation/...",
  "./internal/glob/...",
  "./internal/interval/...",
  "./internal/testflag/...",
  "./internal/operatorselect/...",
  "./internal/drift/...",
  "./internal/coverage/...",
  "./internal/schemas/...",
  "./internal/config/...",
  "./internal/gocmd/...",
  "./internal/report/...",
  "./internal/testlog/...",
  "./internal/tempowner/...",
  "./internal/gitdiff/...",
  "./internal/snapshot/...",
  "./internal/cache/...",
  "./internal/validate/...",
]
baseline_runs = 3

[execution]
jobs = 4

[cache]
mode = "auto"

[policy]
strict = false
minimum_score = 99.75
require_mutants = true

[report]
directory = "reports/mutation"
formats = ["json", "html"]
high = 80
low = 60
