# go-mutants dogfooding itself. This is the configuration `mise run dogfood`
# uses, locally and in CI, and it is also the worked example of the whole v1
# configuration surface. Every key below is decoded strictly: an unknown key is
# an error carrying the line and column where it was found, never a silently
# ignored typo.
#
# Two constraints shape the scope, because this gate runs on every push:
#
#   fast          the job has to finish in minutes, not tens of minutes.
#   deterministic the same tree has to produce the same score twice, or the
#                 minimum_score floor below is a coin flip rather than a gate.
#
# The scope is eight whole packages, where it used to be two files, and two
# things bought that. A scoped test command now scopes the test binaries as
# well, so a mutant is measured against the suites that cover it rather than
# against every suite in the module -- that reason is written down under [test].
# And each package's own suites kill the survivors that kept it out, which is
# how every one of them arrived and the only way the next one will: that story
# is in CHANGELOG.md, which [mutation] points at rather than retelling.
#
# Three of the eight joined for free, which is the one way a floor is allowed to
# widen without a test being written first: they were measured before the line
# was added and every mutant in them was already dead, so this file grew three
# include lines and three test patterns and not one expectation. That is the
# rule below working rather than an exception to it.

version = 1

[mutation]
# Tiers are monotonically inclusive: balanced ⊂ strong ⊂ all.
profile = "balanced"
# Eight whole packages. The first three are the pure core: the mutation model
# everything downstream is built on -- catalogue, mutant identity, rule set,
# scoring, shard assignment and exit policy -- the glob engine those identities
# depend on, and the five-way span relation the interval forest is built on.
# Three more are the small deciders that sit on top of it and are trusted the
# same way: which argument names a test-binary flag, which rules a profile or an
# --operator name selects, and which change to an instrumented snapshot the
# instrumentation did not make. The last two are the readers a run's own
# verdicts pass through: the coverage reader and mapping that decide which
# suites a mutant is measured against, and the JSON schema validation every
# published document goes through. All eight are pure arithmetic, pure text
# matching, a pure filter over a digest table, or a pure decision over values
# handed in, and none of them reads a clock, a network or the filesystem, so a
# mutant either changes an answer or it does not.
#
# The numbers this gate is sized against, from the run that produced them:
#
#   internal/mutation/*.go        450 mutants
#   internal/coverage/*.go        146
#   internal/schemas/*.go          89
#   internal/glob/*.go             68
#   internal/interval/*.go         48
#   internal/operatorselect/*.go   16
#   internal/drift/*.go            11
#   internal/testflag/*.go          7
#
# catalogues 835 mutants and detects 809 of them -- 808 killed and one caught by
# the timeout, which is what an infinite loop looks like from outside -- leaving
# the twenty-six rows declared below and a score of 100.00%, in the wall clock
# recorded under [policy].
#
# The one timeout is worth naming, because it is most of what internal/coverage
# costs. Negating ParseTextfmt's scanner loop turns an empty document into an
# endless one, and there is no way to catch that but to wait: the derived
# per-mutant timeout is the 10s floor here, and one worker spends it on that
# mutant while the other three finish everything else.
#
# internal/mutation was a single file here — shard.go — until its own suites
# grew the tests that kill what the whole-package scope found; CHANGELOG.md
# tells that story under "The dogfood gate covers every pure-core package", and
# the two newest packages under "The dogfood gate reads its own coverage and
# validates its own documents".
#
# What outlives the story is the rule it produced. Widen this list by writing
# the tests that kill the survivors first, and only then the line: excluding the
# files that survive is choosing the scope to fit the score, and declaring the
# survivors away is a skip list wearing a ledger's clothes.
include = [
  "internal/mutation/*.go",
  "internal/glob/*.go",
  "internal/interval/*.go",
  "internal/testflag/*.go",
  "internal/operatorselect/*.go",
  "internal/drift/*.go",
  "internal/coverage/*.go",
  "internal/schemas/*.go",
]
exclude = ["**/*_test.go", "**/testdata/**", "fixtures/**", "vendor-assets/**"]
# `operators` is intentionally omitted: the profile decides the families, which
# keeps this file honest when a new family lands. Uncomment to narrow.
# operators = ["comparison", "error-swallowing"]

# A declared equivalent mutant. An expectation is evidence to check, not a skip
# list: the row is judged on every run, survival fulfills it, a kill is exit 2,
# and an ID that no longer exists in the catalog is stale and also exit 2. The
# row below is judged by a test binary that ran; seven of the rows further down
# are settled by coverage without a process being started, and the notes there
# say why that is the same verdict rather than a weaker one.
#
# This one is the real thing rather than an illustration. `Relate` returns the
# named constant, and `Disjoint` is the first member of its iota block, so
# `Disjoint` and `0` are the same value of the same type after constant
# conversion -- there are not two programs here for a test to tell apart. It
# was found by running this gate, and it is declared rather than tested away or
# quietly excluded, which is the difference between a mutation score and a
# number.
[[mutation.expect]]
id = "7c3b141c043e632d833e0d9b948690bf3efb9047c502de6cb3cd372dfc7685b9"
reason = "Equivalent: Disjoint is the zero value of Relation, being first in its iota block, so `return Disjoint` and `return 0` are the same constant."

# The sixteen rows that follow are the same kind of row, in internal/mutation:
# the survivors there that no honest test can reach. Every survivor a test could
# pin has a test instead, in that package's own suites, which is why this list
# is sixteen rows rather than the forty-one the whole-package scope reported.
# Each row says which of four things it is rather than repeating the word
# "equivalent" sixteen times, because a ledger that argues the same sentence
# over and over is the skip list this file refuses to keep.
#
# Every one of these ids names a mutant the include list above covers, so all
# sixteen are catalogued and judged on every run of this gate rather than taken
# on trust: survival is what fulfills a row, a kill is exit 2, and an id the
# catalogue no longer holds is stale and exit 2 as well. Eleven of them survive a
# test binary that ran. The other five are reported `survived (uncovered)`
# without a process being started, because no binary in this scope reaches the
# line at all -- which is coverage saying, from a cheaper direction, exactly
# what those five reasons argue: an unreachable branch and four error paths
# behind a math.MaxUint32 guard are not lines a suite reaches.

# Equivalent by construction: a comparison the surrounding branch has already
# decided, or a named constant that is its type's zero value.

[[mutation.expect]]
id = "326eb774d53498b186d7a5990a0ee7f0c7dd2cf4934f6ba8adb79a0217b6025b"
reason = "Equivalent: Len returns 0 through the guard for a reversed span and EndByte - StartByte otherwise, and that difference is 0 exactly when the bounds are equal, so `<` and `<=` report the same length for every span."

[[mutation.expect]]
id = "0d13d53c6b4f43b0e2fb26f7da1096974e1caaf4b17cf09e527ddb014cf85abf"
reason = "Equivalent: the comparison sits inside `case s.StartByte != other.StartByte`, where the two start bytes are already known to differ, so `<` and `<=` are the same test."

[[mutation.expect]]
id = "b3bc0192a26baa4e0c2080c6abe78d188189d55ed7544392937d5023b498a485"
reason = "Equivalent: the comparison sits inside `case s.EndByte != other.EndByte`, where the two end bytes are already known to differ, so `<` and `<=` are the same test."

[[mutation.expect]]
id = "9fd083af0792f6b5155cb1cff8883f7a3dce112be8c53e3c92c2ccc0e813044b"
reason = "Equivalent: `>= 2` and `> 2` differ only for two-byte paths; a letter plus colon is rejected by the identical post-clean volume guard immediately below, and every other two-byte path fails the colon-or-letter predicates."

[[mutation.expect]]
id = "ab63a5a3e327b7db2bbe97d3267ca840cebf9cf54a899f10cdc52a111a398548"
reason = "Equivalent: the comparison sits inside `if x.position != y.position`, where the two registry positions are already known to differ, so `<` and `<=` are the same test."

[[mutation.expect]]
id = "90dcb6c9a5eef3328c6287e649f96f5d71187376e2fdb906a262947c815a0c75"
reason = "Equivalent: OutcomeNotRun is the zero value of Outcome, being first in its iota block, so `return OutcomeNotRun` and `return 0` are the same constant -- the same argument as the Disjoint row above."

# Equivalent for every value the type will admit: the mutation changes an
# answer only for an input another check in the same package calls incoherent.

[[mutation.expect]]
id = "cf02d1c0b8855d56c21d1216e47fec02bc0674638c7f3e8ab02ce647af24b391"
reason = "Equivalent for every coherent tally: `p.MinimumScore > 0` and `>= 0` select different runs only when the floor is exactly zero and the score is negative, and a negative percentage needs a negative Detected count, which Score.Validate reports as incoherent."

# A guard on a state this package's own API cannot produce. Not defensive
# programming to be deleted: Build is the last place a candidate can be
# rejected before an ID is minted, and the check is what makes the pipeline
# order in Build's comment true rather than merely intended.

[[mutation.expect]]
id = "71a2e9ed6670de5c01f1c29c061ab45b9a5b6000d754250758601e204f997e68"
reason = "Unreachable: Build only ever sees candidates Add accepted, and Add calls Registry.Verify, which refuses exactly the names Registry.Position cannot find -- both read one immutable map -- so nothing a caller can build reaches this return."

# Guards on the 32-bit length prefix of the identity encoding and on the uint32
# runtime index. Reaching either needs an input of about 2^32 bytes or 2^32
# candidates, so the test that would kill these is a test that allocates four
# gigabytes; the guards stay because the encoding they protect is frozen.

[[mutation.expect]]
id = "e997446d6c157c03f5403f1ea5ae0a63a7b20fab96a4ccafa604197d2c44e929"
reason = "Unkillable: `>` and `>=` pick different catalogues only at exactly math.MaxUint32 queued candidates, which is 4,294,967,295 Candidate values in one builder."

[[mutation.expect]]
id = "a94a2c50fc8b33c7f5ea10f9f5cea1e05eb85138b54119cf80383a8eac4b5c01"
reason = "Unkillable: this return is reached only past math.MaxUint32 queued candidates, so killing it means holding more than 4,294,967,295 Candidate values in memory."

[[mutation.expect]]
id = "0879ed736b35300ea72bf867721591ee218f02a21a7d1fdc5d1a8a89df20a718"
reason = "Unkillable: Build only sees candidates Add validated and Candidate.ID re-runs that same validation, so the only error left for this branch to catch is WriteLengthPrefixed's 4 GiB field guard -- see the id.go rows below."

[[mutation.expect]]
id = "85dc0334ed347973ea6af195207e0cd262ca6a2bfc9c7a710bda312262b5aad7"
reason = "Unkillable: the same branch as the row above -- the error this forwards can only come from WriteLengthPrefixed's 4 GiB field guard."

[[mutation.expect]]
id = "ce40ad71426f18bdb1c7af2f1ab665321d3b2e150d071e52c39b9c6e38ada90c"
reason = "Unkillable: WriteLengthPrefixed fails only on a field longer than math.MaxUint32 bytes, so entering this branch means hashing an identity whose path is four gigabytes long."

[[mutation.expect]]
id = "feba9b0fd4945263451deb51c5fbe281d6fd97a4c98c181f6aec9eebcab4c2c1"
reason = "Unkillable: the same branch as the row above -- the error this forwards exists only for a field longer than math.MaxUint32 bytes."

[[mutation.expect]]
id = "e8eb2f6092486a0554da44e0796371ab157e4bf07c574ef16d9ff8ece74f4474"
reason = "Unkillable: `>` and `>=` disagree only on a string of exactly math.MaxUint32 bytes, so telling them apart means allocating four gigabytes in a unit test."

[[mutation.expect]]
id = "ad9321c58f07017b27f8a9dd8f1e4acad7a38d4a83a9e100589634d63512117c"
reason = "Unkillable: this return is reached only for a string longer than math.MaxUint32 bytes, so killing it means allocating more than four gigabytes in a unit test."

# internal/coverage, whose 146 mutants brought exactly two rows with them. The
# other twenty-six survivors of the first run over that package are dead, killed
# by nine named tests and ten new cases in its own suites -- four of the tests
# in a new white-box file, because the three invariants they pin are true of the
# index, of merge and of relativeTo and change no answer Map gives, so a test
# written through Map could not reach them. See CHANGELOG.md.
#
# What is left is one comparator's secondary key, mutated two ways. Both rows
# make the same argument and it is a proof rather than a shrug: the key orders
# only intervals that already share a start line, and merge folds any run of
# those into one interval reaching the furthest of their ends whatever order the
# sort leaves them in -- so no permutation of a tie changes the merged list, and
# covers reads nothing else. Neither row is uncovered: a case in map_test.go
# gives one file two blocks opening on one line, so the line runs and the
# mutants are executed and reported as survivors rather than skipped.

[[mutation.expect]]
id = "d42fb63591d5db90e42e36081a7f65630aae5c925098abab5ed536f7dd5f57bb"
reason = "Equivalent: this is the tie-break of a sort whose primary key is the start line, so it only orders intervals that share one; merge joins any such run into [start, max end] whatever their order, and nothing downstream reads the order itself."

[[mutation.expect]]
id = "96e3e2eaaff49e3c662188a99235ddcd673af4d3e5c9189bd9b42461d3a5faa6"
reason = "Equivalent: the same tie-break as the row above -- intervals sharing a start line all overlap, so merge folds them into [start, max end] however the sort arranges them, and the primary key still decides every pair whose start lines differ."

# internal/schemas, whose 89 mutants brought seven rows, and all seven are one
# claim: an embedded schema that cannot be used. `schema.FS` is an embed.FS
# fixed at build time, so what it holds is a fact about the binary rather than
# about anything a caller does -- there is no input, no flag and no file on disk
# that can make ReadFile fail, make the bytes stop being JSON, make AddResource
# refuse the "$id", or make Compile reject the schema.
#
# That is not taken on trust either. TestEveryRegisteredSchemaCompiles is the
# negation of all seven, asserted on every run of the suite: for every
# registered document type it reads the file out of the embedded FS and then
# validates `{}` against it, requiring the failure to be GOM5003 rather than
# GOM5004 -- which is only true if the file read, parsed, registered, compiled,
# and was found in the compiled map. So the day one of these branches becomes
# reachable is a day that test is already red, and these rows go stale with it.
#
# The guards stay because they are what makes a broken schema take down one
# report format instead of the whole run, which is stated in CodeSchemaUnusable's
# own documentation. Every other survivor this package first reported is dead:
# seven named tests kill fourteen of them, including the second and third sort
# keys of firstViolation, which needed a trace event carrying somebody else's
# payload to produce two violations at one location.

[[mutation.expect]]
id = "4316f032816f9b8bea32fd9582296b74674df9d53de742511356db366a4e68d9"
reason = "Unreachable: compileErr is set only when an embedded schema cannot be read, parsed, registered or compiled, and TestEveryRegisteredSchemaCompiles asserts that none of that happens in this build, so this branch is never taken."

[[mutation.expect]]
id = "d8c4cff8932d9455d3ef8e81586b06ca622755ecb2f56c108a98ca56b40b25d7"
reason = "Unreachable: the return the row above guards, reported `survived (uncovered)` because no suite reaches a line that needs compileErr to be non-nil."

[[mutation.expect]]
id = "dc8a00968d7b71abe998d1d562013904cb4b84f09b97ee2bfd3e6827bbb3abe9"
reason = "Unreachable: compileAll compiles every type in the registry and schemaFor looks up that same registry, so the lookup cannot miss; TestEveryRegisteredSchemaCompiles asserts it for every registered type."

[[mutation.expect]]
id = "cc88bfab205c63ce546f8c6c20a8481ea065cb270f5c6027731c5a2e4186cfc1"
reason = "Unreachable: the file is read out of an embed.FS fixed at build time, and TestEverySchemaIsRegistered plus TestEveryRegisteredSchemaCompiles assert that every registered name is a file in it, so ReadFile has no failure left to return."

[[mutation.expect]]
id = "5b74b4c090cbff9cd61dc5bc551946c41f0275647a1e79d8c1eb541859d83890"
reason = "Unreachable: the bytes are an embedded schema this repository's own tests parse and compile, so they are JSON in every build TestEveryRegisteredSchemaCompiles passes on."

[[mutation.expect]]
id = "cbed187653982db4970d6f42da553e14e2ef7d932e05de603de728450c5bf382"
reason = "Unreachable: AddResource fails on a resource identity it cannot parse, and TestSchemaIDsMatchTheirFilenames pins every embedded schema's `$id` to `baseURL + <file>`, which is a URL by construction."

[[mutation.expect]]
id = "939b4163d07d97de0f882ab4af250a72f14eaea40a377cff94f7aeab16b01b42"
reason = "Unreachable: every registered schema compiles, which is exactly what TestEveryRegisteredSchemaCompiles asserts by requiring an invalid document to come back GOM5003 rather than GOM5004."

[test]
# An argv vector, never a shell string. Scoped to the eight packages the mutated
# files live in, which is what the baseline proves before any mutant runs. The
# list has to track `include` above line for line: a package whose files are
# mutated but whose suite is not named here has no binary covering it, so every
# mutant in it is reported `survived (uncovered)` and the gate measures the
# scope's silence rather than its tests.
#
# This line is the whole reason the scope above could grow at all. go-mutants
# reads a `test.command` that is `go test` followed only by package patterns as
# a *scope*: it builds a test binary for those packages and for no others, and
# every mutant is measured against that set.
# Before, `internal/execute` listed `./...` whatever the command said, so naming
# a command here bought a fast baseline and then ran the whole module's binaries
# against every mutant -- in import-path order, until one failed, with
# internal/discover's toolchain-driving suite sitting sixth. That was the
# measured minute per mutant this file used to be sized against.
#
# Being read also turns coverage-guided selection on, where it used to be
# reserved for the built-in `go test ./...`. A mutant no binary in this scope
# reaches is reported as `survived (uncovered)` without a process being started
# for it, which is the honest reading of a scope that leaves the line out.
#
# One optimisation is still given up here, and the run says so rather than
# degrading quietly:
#
#   GOM7901  the outcome cache reuses nothing, because cache.mode "auto" only
#            trusts the built-in command. That rule is about whether go-mutants
#            can reason about a command's reproducibility rather than about
#            whether it can read its scope, and the two have not been aligned
#            yet. Setting mode = "on" would promise reproducibility and get the
#            cache; this gate does not need it.
#
# GOM7601 is no longer among them, which is the change worth recording: this
# command is one go-mutants understands, so coverage guidance is on.
#
# Nothing here has to say anything about vet, and that is also a change worth
# recording. The instrumented snapshot is generated code in which every mutant
# of an expression is spliced in beside the original, so `x == "." && x == ".."`
# is a normal shape there -- and `go test` runs vet's `bools` analyzer by
# default and rejects it, which used to stop a run at GOM4013 (the snapshot
# fails its own tests unmutated) or GOM7505 (a test binary would not build).
# `mise run dogfood` worked around it by exporting GOFLAGS=-vet=off over the
# whole run. The engine now handles it: it merges `-vet=off` into GOFLAGS for
# the two commands issued against the instrumented tree -- the instrumented
# baseline and the per-package `go test -c` -- and for nothing else, so the
# pristine baseline below still runs `command` with vet at its default and a
# genuine `bools` finding in this repository's source still fails the run.
#
# `mise run dogfood` does still export RAPID_SEED=1, and running go-mutants
# against this file by hand without it is running a slightly different gate.
# internal/interval's suite is a pgregory.net/rapid property suite, rapid draws
# a fresh random seed per process unless one is pinned, and an unpinned seed
# makes the score -- and so the minimum_score floor below -- vary between runs
# of an unchanged tree.
command = [
  "go",
  "test",
  "./internal/mutation/...",
  "./internal/glob/...",
  "./internal/interval/...",
  "./internal/testflag/...",
  "./internal/operatorselect/...",
  "./internal/drift/...",
  "./internal/coverage/...",
  "./internal/schemas/...",
]
# Deliberately omitted, where this file used to pin 180s. The old number was
# derived from a fact that scoping has deleted: the timeout had to clear
# internal/discover's binary, which drives the real Go toolchain for about a
# minute and which every mutant used to run. That binary is not built any more.
# What is left is max(10s, slowest baseline × 5) over a scoped baseline that
# measures in seconds, bounding test binaries that measure in fractions of one,
# and a derived bound moves with the machine instead of being a number somebody
# has to remember to re-measure.
baseline_runs = 3

[execution]
# Pinned so that a developer's run and a GitHub-hosted CI run are the same run,
# and so the wall clock quoted under [policy] means something on both. It is no
# longer pinned for correctness: the old reason was that every mutant ran the
# whole module's binaries, several of which drive the real Go toolchain, so the
# default of min(NumCPU, 8) meant eight concurrent toolchains and completed no
# mutants in ten minutes. With the scope above a mutant runs one or two fast
# unit-test binaries, and the default would simply be quicker on a large
# machine. Four is what a GitHub-hosted runner resolves to.
jobs = 4

[cache]
# auto reuses proven outcomes keyed by tool version, executable digest,
# workspace digest, catalog digest, command, the timeout as configured, and
# GOFLAGS/GOOS/GOARCH -- and reuses nothing at all when test.command is not the
# built-in `go test ./...`, because go-mutants cannot reason about a command it
# did not write. That is this file's own situation; see GOM7901 above. Left at
# auto rather than "on" because promising that a command is reproducible is a
# promise, and this gate does not need it.
mode = "auto"
# directory = "team-cache"

[policy]
# strict stays false in the file on purpose: the gate belongs to the caller.
# `mise run dogfood` and the CI job that runs it pass --strict, so a developer
# who wants to look at a survivor rather than be failed by it just runs
# `go-mutants run`. That is not the same as a run that cannot fail: the floor
# below is compared on every run, --strict or not, and the note there says
# where each of the two gates actually bites.
strict = false
# Measured, not wished for. The scope catalogues 835 mutants. Eight hundred and
# nine are detected -- 808 killed and one caught by the timeout -- and the other
# twenty-six are the rows declared above, which leave the denominator rather
# than counting against it, so the measured score is 100.00%, with all
# twenty-six expectations fulfilled and none stale.
#
# What each widening cost is a paired measurement rather than a remembered one
# -- the run before it and the run after it, back to back on one machine at
# --jobs 4:
#
#   warm test-owned build cache   566 mutants in 8.8-9.0s, 600 in 9.9-10.5s
#   cold test-owned build cache   38s either way
#
# Thirty-four more mutants for about a second warm, and for nothing at all
# cold, because a cold run is dominated by compiling the module and its test
# binaries and internal/testflag, internal/operatorselect and internal/drift are
# 125 lines between them. Cold is what CI measures: the dogfood job points
# GO_MUTANTS_TEST_GOCACHE at the runner's temporary directory and never restores
# it from an actions cache.
#
# internal/coverage and internal/schemas cost more than their 235 mutants
# suggest, and one mutant is most of it: the timeout named under [mutation]
# spends the whole 10s floor on one worker whatever else the run has to do.
#
# Only the ratio travels; the absolute numbers are the machine. The scope
# before this one -- three packages, 566 mutants -- was recorded here as
# 1m10s-1m30s on the machine that measured it, where the scope before that --
# one file and two packages, 121 mutants -- took 48-50 seconds and the one
# before that -- two files, sixteen mutants -- took 7m08s. What does not vary
# with the machine is the tally: 835 catalogued, 808 killed, one timed out, 26
# expected, on every run of an unchanged tree.
#
# The floor did not move with the scope this time, and the arithmetic is why.
# It is worth being exact about which gate the remaining slack belongs to,
# because the two are independent and only one of them guards CI:
#
#   --strict            mutation.Decide fails on UnexpectedSurvivors > 0, so
#                       the first unexpected survivor is exit 1 for the dogfood
#                       task and for CI. There is no headroom on that gate at
#                       all, and none is wanted.
#   minimum_score = 99  compared against the measured score whether or not
#                       --strict was passed. Eight hundred and nine scored
#                       mutants are worth 0.124 points each, so 801/809 =
#                       99.01% clears 99 and 800/809 = 98.89% does not: an
#                       ungated `go-mutants run` reports up to eight survivors
#                       and exits 0, and fails at nine.
#
# Ninety-six is what stood here while 120 mutants were scored, where it bought
# four survivors of slack. At 544 the same number would buy twenty-one, which is
# a materially weaker backstop wearing a number that had not changed, so it went
# up rather than staying put. Ninety-nine has stayed put through every widening
# since, and that is arithmetic rather than inertia: one percent of 549 is 5.49,
# of 583 is 5.83 and of 809 is 8.09, so the slack this floor buys went five,
# five, eight while the catalogue grew by half again. The floor is still
# deliberately the looser of the two gates: it is the backstop for a run that
# did not ask to be gated, never the thing keeping CI honest, and a green CI run
# is never green because of it. Raise it again if the scope grows enough to make
# that count material; do not lower it to accommodate a survivor that a test
# could kill.
minimum_score = 99
require_mutants = true

[report]
directory = "reports/mutation"
formats = ["json", "html"]
# HTML colouring thresholds only; they are independent of [policy].
high = 80
low = 60
