# go-mutants dogfooding itself. This is the configuration `mise run dogfood`
# uses, locally and in CI, and it is also the worked example of the whole v1
# configuration surface. Every key below is decoded strictly: an unknown key is
# an error carrying the line and column where it was found, never a silently
# ignored typo.
#
# Two constraints shape the scope, because this gate runs on every push:
#
#   fast          the job has to finish in minutes, not tens of minutes.
#   deterministic the same tree has to produce the same score twice, or the
#                 minimum_score floor below is a coin flip rather than a gate.
#
# The scope is two whole packages and one file, where it used to be two files,
# and the reason it could grow is written down under [test]: a scoped test
# command now scopes the test binaries as well, so a mutant is measured against
# the suites that cover it rather than against every suite in the module.

version = 1

[mutation]
# Tiers are monotonically inclusive: balanced ⊂ strong ⊂ all.
profile = "balanced"
# Two whole packages and the file that was here before them: shard assignment,
# the glob engine mutant ids depend on, and the five-way span relation the
# interval forest is built on. All three are pure arithmetic or pure text
# matching that everything downstream trusts, and none of them touches a clock,
# a network or the filesystem, so a mutant either changes an answer or it does
# not.
#
# Why not all of internal/mutation, which is what the scoping change was
# supposed to buy. It was measured, and the number that stopped it is not the
# clock. The whole-package scope
#
#   internal/mutation/*.go + internal/glob/*.go + internal/interval/*.go
#
# catalogues 560 mutants (444 + 68 + 48) and runs in 1m20s at --jobs 4, which is
# comfortably inside this gate's budget. It also reports 41 unexpected survivors,
# every one of them in internal/mutation and spread over seven of its eight
# files: 14 in catalog.go, 12 in id.go, 6 in rule.go, 4 in span.go, 3 in
# exitpolicy.go, and one each in outcome.go and score.go. They are real findings
# — `Tier.String()` returning "" instead of "strong" is not caught by anything,
# nor are several `>=`/`<=` boundaries in id.go's validation — and the honest
# way to include that package is to write the tests that kill them, in the same
# change. Declaring 41 expectations would be a skip list wearing a ledger's
# clothes, and excluding the seven files that survive would be choosing the
# scope to fit the score.
#
# shard.go is kept rather than dropped for the same reason it was here before:
# its suite kills every mutant in it, which is what makes it worth gating on.
# Widening to the rest of the package is a one-line change to this file once
# those tests exist.
include = [
  "internal/mutation/shard.go",
  "internal/glob/*.go",
  "internal/interval/*.go",
]
exclude = ["**/*_test.go", "**/testdata/**", "fixtures/**", "vendor-assets/**"]
# `operators` is intentionally omitted: the profile decides the families, which
# keeps this file honest when a new family lands. Uncomment to narrow.
# operators = ["comparison", "error-swallowing"]

# A declared equivalent mutant. An expectation is evidence to check, not a skip
# list: the mutant still runs, survival fulfills it, a kill is exit 2, and an
# ID that no longer exists in the catalog is stale and also exit 2.
#
# This one is the real thing rather than an illustration. `Relate` returns the
# named constant, and `Disjoint` is the first member of its iota block, so
# `Disjoint` and `0` are the same value of the same type after constant
# conversion -- there are not two programs here for a test to tell apart. It
# was found by running this gate, and it is declared rather than tested away or
# quietly excluded, which is the difference between a mutation score and a
# number.
[[mutation.expect]]
id = "7c3b141c043e632d833e0d9b948690bf3efb9047c502de6cb3cd372dfc7685b9"
reason = "Equivalent: Disjoint is the zero value of Relation, being first in its iota block, so `return Disjoint` and `return 0` are the same constant."

[test]
# An argv vector, never a shell string. Scoped to the three packages the mutated
# files live in, which is what the baseline proves before any mutant runs.
#
# This line is the whole reason the scope above could grow at all. go-mutants
# reads a `test.command` that is `go test` followed only by package patterns as
# a *scope*: it builds a test binary for those packages and for no others, and
# every mutant is measured against that set.
# Before, `internal/execute` listed `./...` whatever the command said, so naming
# a command here bought a fast baseline and then ran the whole module's binaries
# against every mutant -- in import-path order, until one failed, with
# internal/discover's toolchain-driving suite sitting sixth. That was the
# measured minute per mutant this file used to be sized against.
#
# Being read also turns coverage-guided selection on, where it used to be
# reserved for the built-in `go test ./...`. A mutant no binary in this scope
# reaches is reported as `survived (uncovered)` without a process being started
# for it, which is the honest reading of a scope that leaves the line out.
#
# One optimisation is still given up here, and the run says so rather than
# degrading quietly:
#
#   GOM7901  the outcome cache reuses nothing, because cache.mode "auto" only
#            trusts the built-in command. That rule is about whether go-mutants
#            can reason about a command's reproducibility rather than about
#            whether it can read its scope, and the two have not been aligned
#            yet. Setting mode = "on" would promise reproducibility and get the
#            cache; this gate does not need it.
#
# GOM7601 is no longer among them, which is the change worth recording: this
# command is one go-mutants understands, so coverage guidance is on.
#
# Nothing here has to say anything about vet, and that is also a change worth
# recording. The instrumented snapshot is generated code in which every mutant
# of an expression is spliced in beside the original, so `x == "." && x == ".."`
# is a normal shape there -- and `go test` runs vet's `bools` analyzer by
# default and rejects it, which used to stop a run at GOM4013 (the snapshot
# fails its own tests unmutated) or GOM7505 (a test binary would not build).
# `mise run dogfood` worked around it by exporting GOFLAGS=-vet=off over the
# whole run. The engine now handles it: it merges `-vet=off` into GOFLAGS for
# the two commands issued against the instrumented tree -- the instrumented
# baseline and the per-package `go test -c` -- and for nothing else, so the
# pristine baseline below still runs `command` with vet at its default and a
# genuine `bools` finding in this repository's source still fails the run.
#
# `mise run dogfood` does still export RAPID_SEED=1, and running go-mutants
# against this file by hand without it is running a slightly different gate.
# internal/interval's suite is a pgregory.net/rapid property suite, rapid draws
# a fresh random seed per process unless one is pinned, and an unpinned seed
# makes the score -- and so the minimum_score floor below -- vary between runs
# of an unchanged tree.
command = [
  "go",
  "test",
  "./internal/mutation/...",
  "./internal/glob/...",
  "./internal/interval/...",
]
# Deliberately omitted, where this file used to pin 180s. The old number was
# derived from a fact that scoping has deleted: the timeout had to clear
# internal/discover's binary, which drives the real Go toolchain for about a
# minute and which every mutant used to run. That binary is not built any more.
# What is left is max(10s, slowest baseline × 5) over a scoped baseline that
# measures in seconds, bounding test binaries that measure in fractions of one,
# and a derived bound moves with the machine instead of being a number somebody
# has to remember to re-measure.
baseline_runs = 3

[execution]
# Pinned so that a developer's run and a GitHub-hosted CI run are the same run,
# and so the wall clock quoted under [policy] means something on both. It is no
# longer pinned for correctness: the old reason was that every mutant ran the
# whole module's binaries, several of which drive the real Go toolchain, so the
# default of min(NumCPU, 8) meant eight concurrent toolchains and completed no
# mutants in ten minutes. With the scope above a mutant runs one or two fast
# unit-test binaries, and the default would simply be quicker on a large
# machine. Four is what a GitHub-hosted runner resolves to.
jobs = 4

[cache]
# auto reuses proven outcomes keyed by tool version, executable digest,
# workspace digest, catalog digest, command, the timeout as configured, and
# GOFLAGS/GOOS/GOARCH -- and reuses nothing at all when test.command is not the
# built-in `go test ./...`, because go-mutants cannot reason about a command it
# did not write. That is this file's own situation; see GOM7901 above. Left at
# auto rather than "on" because promising that a command is reproducible is a
# promise, and this gate does not need it.
mode = "auto"
# directory = "team-cache"

[policy]
# strict stays false in the file on purpose: the gate belongs to the caller.
# `mise run dogfood` and the CI job that runs it pass --strict, so a developer
# who wants to look at a survivor rather than be failed by it just runs
# `go-mutants run`. That is not the same as a run that cannot fail: the floor
# below is compared on every run, --strict or not, and the note there says
# where each of the two gates actually bites.
strict = false
# Measured, not wished for. The scope generates 121 mutants. One hundred and
# twenty are killed and the hundred-and-twenty-first is the declared equivalent
# above, which leaves the denominator rather than counting against it, so the
# measured score is 100.00%. `mise run dogfood` takes 48-50 seconds at --jobs 4
# over three runs, on the same machine the previous scope -- two files, sixteen
# mutants -- took 7m08s on. The difference is scoped test binaries.
#
# The floor is four points under that, and it is worth being exact about which
# gate that slack belongs to, because the two are independent and only one of
# them guards CI:
#
#   --strict            mutation.Decide fails on UnexpectedSurvivors > 0, so
#                       the first unexpected survivor is exit 1 for the dogfood
#                       task and for CI. There is no headroom on that gate at
#                       all, and none is wanted.
#   minimum_score = 96  compared against the measured score whether or not
#                       --strict was passed. One hundred and twenty scored
#                       mutants are worth 0.83 points each, so 116/120 = 96.67%
#                       clears 96 and 115/120 = 95.83% does not: an ungated
#                       `go-mutants run` reports up to four survivors and exits
#                       0, and fails at five.
#
# So the floor is deliberately the looser of the two. It is the backstop for a
# run that did not ask to be gated, never the thing keeping CI honest, and a
# green CI run is never green because of it. Raise it if the scope grows; do
# not lower it to accommodate a survivor that a test could kill.
minimum_score = 96
require_mutants = true

[report]
directory = "reports/mutation"
formats = ["json", "html"]
# HTML colouring thresholds only; they are independent of [policy].
high = 80
low = 60
