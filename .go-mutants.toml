# internal/config, whose 461 mutants brought four rows, and all four are one
# function: toInt, which narrows a decoded TOML integer by saturating rather
# than truncating, so that `jobs = 4294967297` stays absurd on a 32-bit build
# instead of arriving as 1.
#
# The four are two pairs, and each pair is a different claim about the same two
# lines. The comparisons are equivalent on every platform, 32-bit included:
# `>` and `>=` disagree only at exactly int64(maxInt), where the guard returns
# maxInt and falling through returns int(v) -- and those are the same number,
# which is what makes the boundary the one place the mutation cannot show. The
# two returns behind them are the saturation itself, and on a 64-bit build
# int64(maxInt) is math.MaxInt64, so no int64 is greater than it and no int64
# is less than int64(minInt): both branches are dead code in this binary and
# both are reported `survived (uncovered)` without a process being started.
#
# They stay because 32-bit is where they are not dead, and because every other
# survivor this package has ever reported is dead rather than declared:
# forty-two of the forty-six the first run over it found, and then all seven
# that arrived with `test.memory`'s own size vocabulary -- a renderer whose
# unit boundaries nothing had ever asserted, and the refusal of a size too
# large for an int64. Both sets are named in CHANGELOG.md under "The dogfood
# gate reads its own configuration".
#
# The one thing this ledger cannot say about these four is "unkillable
# everywhere", so it does not say it. A `GOARCH=386` run of this package's
# suite would kill the two returns; this gate does not do that, and pretending
# otherwise would be the kind of shrug the rows above refuse.
#
# Their ids moved once, and how is worth a line for whoever meets a stale row
# next. Nothing about toInt changed; `test.memory` added lines above it in
# load.go, the four spans moved down eleven lines, and a mutant identity is
# built from where the code is. A stale row is exit 2 and says which id it
# could not find, which is the ledger working: the fix was to re-read the ids
# out of the run, never to relax the check that noticed.

[[mutation.expect]]
id = "3293a81a48613c6b4ec80c0ec2327aa8b8494f35c4db89c61cde9968a858994e"
reason = "Equivalent on every platform: `v > int64(maxInt)` and `v >= int64(maxInt)` select different branches only at exactly int64(maxInt), where the guard returns maxInt and falling through returns int(v) -- and int(int64(maxInt)) is maxInt, so both spellings narrow every int64 to the same int."

[[mutation.expect]]
id = "271f4a89a0bc3384ae00bb92d1a73092af73b8560ec782d178262d867452f318"
reason = "Unreachable on a 64-bit build, which is every platform this gate runs on: maxInt is int(^uint(0) >> 1), so int64(maxInt) is math.MaxInt64 and no int64 is greater than it. Killing it means running this package's suite on a 32-bit GOARCH."

