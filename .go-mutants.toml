# go-mutants dogfooding itself. This is the configuration `mise run dogfood`
# uses, locally and in CI, and it is also the worked example of the whole v1
# configuration surface. Every key below is decoded strictly: an unknown key is
# an error carrying the line and column where it was found, never a silently
# ignored typo.
#
# Two constraints shape the scope, because this gate runs on every push:
#
#   fast          the job has to finish in minutes, not tens of minutes.
#   deterministic the same tree has to produce the same score twice, or the
#                 minimum_score floor below is a coin flip rather than a gate.
#
# The scope is ten whole packages, where it used to be two files, and two
# things bought that. A scoped test command now scopes the test binaries as
# well, so a mutant is measured against the suites that cover it rather than
# against every suite in the module -- that reason is written down under [test].
# And each package's own suites kill the survivors that kept it out, which is
# how every one of them arrived and the only way the next one will: that story
# is in CHANGELOG.md, which [mutation] points at rather than retelling.
#
# Three of the eleven joined for free, which is the one way a floor is allowed to
# widen without a test being written first: they were measured before the line
# was added and every mutant in them was already dead, so this file grew three
# include lines and three test patterns and not one expectation. That is the
# rule below working rather than an exception to it.
#
# What "deterministic" claims was worth being exact about, because the ninth
# package briefly made one part of it false and then paid for the fix. Two of
# internal/config's mutants do not spin when they fail to return: they allocate.
# Until a mutant was bounded in memory the way it has always been bounded in
# time, their verdict was a race -- killed when the allocator reached them
# first, timed out when the clock did -- and one of them did not fail a CI run
# so much as end it, with the runner receiving a shutdown signal.
#
# That is what `test.memory` and the derived max(1GiB, largest baseline peak x 4)
# exist for, and with the bound in place the split is a fact again rather than a
# race: 4318 killed, three caught by a counted loop, seventy-five declared, 100.00%,
# identical on every run measured under [policy]. The mutants that allocate are
# stopped in about a second and a half each, and the ledger below did not grow a
# row for them, because a mutant the bound stops is killed rather than excused:
# the original program was measured under the budget the bound came from, so a
# tree needing four times what the whole suite needed has been changed
# observably.
#
# The tenth package is the first one here that starts processes, and it is worth
# saying what that did and did not cost. internal/gocmd's suite scripts a `go`
# rather than reaching for one, so it stays deterministic -- but the baseline it
# is part of got slower, and the per-mutant timeout is derived from that
# baseline, so the three mutants that never return each pay for it twice. That
# is the whole of what the widening cost in wall clock, and the paired
# measurements under [policy] show it as a fact rather than as an estimate. What
# it did not cost is a fourth such mutant: internal/gocmd had one, and it was
# turned into a kill rather than accepted. See CHANGELOG.md.

version = 1

[mutation]
# Tiers are monotonically inclusive: balanced ⊂ strong ⊂ all.
profile = "balanced"
# Ten whole packages. The first three are the pure core: the mutation model
# everything downstream is built on -- catalogue, mutant identity, rule set,
# scoring, shard assignment and exit policy -- the glob engine those identities
# depend on, and the five-way span relation the interval forest is built on.
# Three more are the small deciders that sit on top of it and are trusted the
# same way: which argument names a test-binary flag, which rules a profile or an
# --operator name selects, and which change to an instrumented snapshot the
# instrumentation did not make. Two are the readers a run's own verdicts pass
# through: the coverage reader and mapping that decide which suites a mutant is
# measured against, and the JSON schema validation every published document
# goes through. The ninth is this file's own reader -- decoding, validation,
# precedence, and the position walk that puts a caret under the value a
# diagnostic is about -- which makes the worked example below one of the
# documents the scope is measured on.
#
# The tenth is the toolchain wrapper, and it is the first one here that is not
# a decision over values handed in. internal/gocmd finds `go`, probes it,
# parses what it printed, shapes the environment a child is handed, and hands
# back an argument vector -- so a mutant in it can change which binary a run
# uses, how long it waits for one that never answers, whether a `-mod=readonly`
# somebody set survives, or whether a failure arrives with the bytes that
# explain it. Its unit tier is process-level for exactly that reason and stays
# toolchain-free anyway: internal/testkit/mutantkit's scripted `go` answers from
# a table, so a probe that hangs, one that exits non-zero, one that cannot be
# started at all and one that answers garbage are all real processes and none of
# them is the machine's toolchain. The one thing that has to meet a real `go` --
# that the parser agrees with what a released toolchain prints -- carries
# `//go:build integration` and is outside this scope, which is correct: it is a
# claim about Go rather than about go-mutants.
#
# The other nine are pure arithmetic, pure text matching, a pure filter over a
# digest table, or a pure decision over values handed in, and none of them reads
# a clock or a network. internal/config reads a file, and only through
# os.ReadFile in LoadFile: everything a mutant can reach below that takes bytes
# and returns an answer.
#
# The eleventh is the one that breaks that sentence, and it is the largest.
# internal/report is what a run writes down: the RunReport v1 document every
# other output is derived from, the history store kept under the operating
# system's cache directory, the projection into the published
# mutation-testing-report format, the self-contained page rendered from it, and
# the merge that puts a split run back together. It is the first package in this
# scope that writes files -- two into the user's own tree and a history into a
# directory it shares with every other program on the machine -- so a survivor
# in it can be a failure the operating system will not produce on demand rather
# than a value nobody asserted. The tests stage the failures it will produce and
# the source grew two seams for the three it will not; the note above the
# internal/report rows below says which is which.
#
# The numbers this gate is sized against, from the run that produced them:
#
#   internal/report/*.go         1365 mutants
#   internal/config/*.go          505
#   internal/mutation/*.go        477
#   internal/cache/*.go           427
#   internal/validate/*.go        370
#   internal/snapshot/*.go        329
#   internal/gitdiff/*.go         257
#   internal/coverage/*.go        164
#   internal/tempowner/*.go       121
#   internal/gocmd/*.go           112
#   internal/schemas/*.go          89
#   internal/glob/*.go             71
#   internal/interval/*.go         50
#   internal/drift/*.go            21
#   internal/operatorselect/*.go   16
#   internal/testlog/*.go          15
#   internal/testflag/*.go          7
#
# catalogues 4396 mutants and detects 4321 of them -- 4318 killed and three
# caught by a counted loop -- leaving the seventy-five rows declared below and a
# score of 100.00%, in the wall clock recorded under [policy].
#
# Two things the table does not say, and both are worth saying here rather than
# being inferred from a number.
#
# Windows is not in it and cannot be. internal/tempowner/lock_windows.go is not
# built on the platforms this gate runs on, so discovery never opens it and not
# one of its lines is in the 121 above. A gate that said nothing about what it
# does not cover would be a number wearing a gate's clothes.
#
# And 257 of these mutants need `git` on PATH. internal/gitdiff's suite drives a
# real git, because everything about reading git is what git actually prints,
# and without one those tests skip -- so on a machine with no git this gate
# reports two hundred and fifty-seven survivors rather than naming the missing
# tool. GO_MUTANTS_TEST_REQUIRE_TOOLS is what turns such a skip into a failure,
# and it cannot reach here: internal/execute strips every GO_MUTANTS_ variable
# from every child a run starts, which is the rule that keeps a developer's
# exported GO_MUTANTS_ACTIVE from running a mutant as the baseline. So the
# symptom is written down instead: survivors concentrated in one package, all of
# them in internal/gitdiff, means git rather than a regression. The count has grown eight
# times without the score moving, and every time for the same reason: code the
# gate already covered started producing mutants it had not produced before.
# Once it has fallen, for the opposite and better reason:
#
#   4014 to 4383   internal/validate joined the gate (2026-09-15): 369 new
#                  mutants and four declared rows. It was the widening this
#                  file's own prose kept for last, because the phase spawns
#                  processes -- and the seams it already had are why it cost
#                  four rows and no timeouts: the compiler and the rewriter are
#                  fields, so "the machine stopped being able to build" is a
#                  table rather than a state a test has to produce. Thirteen
#                  never-returning mutants came off with it, by bounding the
#                  search's loop at one pass per catalogued file instead of
#                  resting its exit on a lemma about another function.
#
#   3592 to 4014   internal/cache joined the gate (2026-09-15): 422 new
#                  mutants and eight declared rows. It is the package that
#                  deletes files in a directory it shares with every other
#                  program on the machine, and most of its mutants sit on a
#                  failure path: a cache root that cannot be listed, a workspace
#                  carrying somebody else's marker, an entry that cannot be
#                  read, a rename that cannot land. Six operating-system calls
#                  it cannot be made to fail are named in
#                  internal/cache/seams.go. Three comparisons came out rather
#                  than being declared -- a truncation boundary that cuts the
#                  same string either way, a clamp written as a guard, and a
#                  pair of sorts restating an ordering os.ReadDir already
#                  guarantees -- and one double computation of the cache key
#                  with it.
#
#   3263 to 3592   internal/snapshot joined the gate (2026-09-15): 329 new
#                  mutants and two declared rows, both of them one branch that
#                  no configured value reaches. Most of this package is
#                  filesystem failure paths, and most of those are staged for
#                  real -- a source root that cannot be listed, an entry that
#                  cannot be stat-ed, a destination parent that refuses writes,
#                  a destination that already exists. The eight that cannot be
#                  staged are named in internal/snapshot/seams.go, which is the
#                  whole list of operating-system calls this package cannot be
#                  made to fail. Four mutants that never returned went with the
#                  widening rather than into it: the walk's two path helpers had
#                  a guard each whose other reading walked the root again at
#                  every depth.
#
#   3006 to 3263   internal/gitdiff joined the gate (2026-09-15): 257 new
#                  mutants, every one of them killed, and not one declared row.
#                  It was the widening this file's own prose called the hard
#                  one, and most of the work was in two places rather than in
#                  the count: the failures a repository cannot be put into now
#                  go through a seam on the command runner, and four boundary
#                  comparisons that had two spellings and one answer were
#                  rewritten as the one answer.
#
#   2885 to 3006   internal/tempowner joined the gate (2026-09-14): 121 new
#                  mutants, every one of them killed, and not one declared row.
#                  The widening cost five tests -- the flock wrapper's three
#                  answers, an unlock the kernel refuses, a clock RFC 3339
#                  cannot write down, a lock the sweep cannot give back, and a
#                  file inside a listable directory that cannot be stat-ed --
#                  and one shape change: the two errnos that mean "somebody
#                  else holds it" are two cases of one switch rather than the
#                  two halves of an `||`, because where they are equal the `||`
#                  and an `&&` are the same expression.
#
#   2888 to 2885   refusing an edit whose replacement is the constant the source
#                  already holds (2026-09-14): three fewer mutants, and three
#                  fewer rows in the ledger below. `return Disjoint`, `return
#                  OutcomeNotRun` and `return mutation.OutcomeNotRun` were each
#                  the head of an iota block returned where the rule proposes
#                  `0`; go/types folds both readings to the same constant, so
#                  there were never two programs there. Nothing that was killed
#                  stopped being killed: the detected count is the same 2822 it
#                  was, and only the denominator lost the three mutants that
#                  could never have been in it.
#
#   2736 to 2873   measuring a `go.work` as one run over every module it joins
#                  (2026-09-14): 137 new mutants, most of them the workspace
#                  report and the parts of internal/report, internal/coverage
#                  and internal/schemas that learned which module a path is
#                  relative to. Two of them are declared and the rest are killed
#                  by the tests written with them. The declared rows are two
#                  lines of one unreachable branch, which is one place rather
#                  than three because both constructors of a workspace report
#                  return through it.
#
#   2722 to 2736   the module coordinate a workspace mutant is catalogued under
#                  (2026-09-14): fourteen new mutants in internal/mutation --
#                  the module in the digest, original-text and deduplication
#                  keys, in the canonical order, and the refusal of a catalogue
#                  that mixes the two recipes -- of which five survived until
#                  the tests that kill them were written. Six rows naming a
#                  mutant of catalog.go were reissued, because the digest of the
#                  file changed and no existing identity did.
#   2497 to 2549   the test-level narrowing feature added its own code to the
#                  gated packages (2026-09-08).
#   2549 to 2677   discovery reached the case labels of a tagless switch, which
#                  it had been suppressing before it ever consulted the guard
#                  chooser -- 128 mutants in code nobody added, spread across
#                  every package here, of which six survived until the tests
#                  that kill them were written (2026-09-14).
#   2716 to 2722   the second identity domain, for a mutant measured as part of
#                  a multi-module workspace (2026-09-14): six new mutants in
#                  internal/mutation, all killed by the tests written with it.
#                  The nine-field recipe is unchanged, so not one existing
#                  identity moved -- what moved is the digest of the file the
#                  recipe lives in, which is why the five rows naming a mutant
#                  of it were reissued.
#   2689 to 2716   `test.probing` and the report field it settles mutants into
#                  (2026-09-14): twenty-seven new mutants across
#                  internal/config and internal/report, seventeen of which
#                  survived until the tests that kill them were written. The
#                  probe layer's own code is in internal/probe and
#                  internal/engine, neither of which the gate covers yet.
#   2684 to 2689   `execution.isolate` and the code that reads it (2026-09-14):
#                  five new mutants in internal/config, all killed by the
#                  tests written with the feature. A widening the gate pays
#                  for on its own.
#   2677 to 2684   two new guard forms reached seven sites that had been
#                  recorded refusals: a `:=` in a `for` initialiser, in six
#                  places, and one that redeclares. Every one of the seven was
#                  killed by tests that already existed, which is what a refusal
#                  being lifted usually looks like -- the code was covered, only
#                  the mutant was missing. This scope now records no
#                  `unnameable-decl-type` skip at all.
#
# The declared rows went from sixty-five to sixty-three on 2026-09-14: seven
# internal/schemas rows were reissued under new identities when that file gained
# a schema registration, and two rows at the store's path resolution turned out
# to describe macOS rather than the code. They went back to sixty-five the same
# day, and for the reason the paragraph above gives rather than against it: a
# workspace report is assembled by two constructors that return through one
# line, and the total that line derives has already been counted once by every
# module's own document -- so the two rows are one unreachable branch, declared
# in one place rather than at each of them.
#
# internal/report is nearly as large as the other ten together, and that is
# what a lossless document costs: every field of it is checked on the way in,
# every refusal is a sentence somebody reads, and two more documents are derived
# from it. internal/config is the second largest and did not get there by being
# included either: it grew `test.memory` and the byte-size vocabulary that reads
# it, which is 36 more mutants and the direct consequence of the paragraph
# below. A scope that catches what it costs is a scope that then has to be
# measured again, which is what happened here, twice.
#
# The three that never return are worth naming, because there used to be six and
# because what they cost has changed by three orders of magnitude.
#
# They are settled by counting rather than by waiting now. Every loop of the
# instrumented tree carries a counter, the ceiling is what the original program
# did in that tree under this suite as the instrumented baseline measured it,
# and a loop that passes its own ends the process naming itself and both counts.
# Measured here: 17ms, 28ms and 228ms, against a derived budget of 53s that each
# of them used to pay twice. The verdict is the one it always was; what changed
# is that it is a fact about the program rather than an observation about the
# machine, and that the report says which loop. See ADR 0013.
#
# Two spin: negating ParseTextfmt's scanner loop turns an empty document into an
# endless one, and negating the loop that neutralises a double hyphen inside the
# HTML report's attribution comment never stops replacing what it has just
# written. The third allocates: lineStarts with its stride turned into a
# subtraction stops making progress through the file and appends to a slice
# instead, and where the memory bound can be enforced it is stopped at about 1.1
# GiB in a second and a half -- once, with no second attempt, because a memory
# kill is a kill rather than a verdict to confirm. Where the bound cannot be
# enforced, which is macOS, the counter is what ends it, in the same
# milliseconds as the other two.
#
# The three that stopped being among them are the reason this paragraph was
# rewritten, and they were not fixed: they were measured differently. A mutant
# run stops at the first test that fails, because one failure is its whole
# answer, and each of these three fails a test before it reaches the input that
# hangs it. Negating lineStarts' own exit condition returns after the first
# newline, which every test with a newline in it catches in milliseconds; only a
# document with no newline at all reaches the endless append, and the binary is
# gone before that test starts. The verdict is a kill instead of a timeout,
# which is the more precise of the two and is scored the same -- and it is three
# mutants no longer paying two full budgets each. See CHANGELOG.md.
#
# "Where the bound can be enforced" is load-bearing and used not to be written
# down. The bound is derived rather than configured here, and a *derived* bound
# this platform cannot hold anybody to is dropped and reported as
# `memory_source: unavailable` -- deliberately without a warning, because a line
# on every clean run of an unsupported platform is how a warning stops being
# read (internal/engine's unenforcedMemoryReason argues it in full). macOS is
# such a platform: it can say what a process cost once it is gone and cannot
# watch one while it runs. So on a macOS developer's machine these two are not
# stopped at 1.1 GiB at all. Measured here on 2026-09-14, they reached resident
# peaks of 19.1 GiB and 10.5 GiB before the 20-second timeout ended them, and
# the report records those peaks on the mutants. That is not a regression and
# nothing about the verdict changes -- a timeout is detected exactly as a memory
# kill is -- but a note claiming the bound stops them is a note that is true on
# the runner and false on half the machines that read it.
#
# Five is also what internal/gocmd did not make six, and that is the one part of
# this list that a test moved. Negating `timeout <= 0` in LocateContext replaces
# a probe's configured deadline with the thirty-second default, and the suite's
# hanging-probe case scripted a `go` that slept for two minutes -- so the mutant
# waited, and only the per-mutant timeout could end it, twice. The sleep bought
# nothing the test's own assertion did not already buy: it fails a probe that is
# still running at five times its deadline, so anything past that is unreachable
# by the claim. Shortened to three seconds -- fifteen times the deadline, three
# times the bound, and well under the default -- the mutant comes back with a
# parse error instead of a deadline and dies in about three seconds. A mutant
# that never returns is sometimes a fact about the code and sometimes a fact
# about a constant in a test, and the two are worth telling apart before the
# gate pays for one twice on every run.
#
# internal/mutation was a single file here — shard.go — until its own suites
# grew the tests that kill what the whole-package scope found; CHANGELOG.md
# tells that story under "The dogfood gate covers every pure-core package", the
# two readers under "The dogfood gate reads its own coverage and validates its
# own documents", this file's own reader under "The dogfood gate reads its own
# configuration", and the toolchain wrapper under "The dogfood gate covers the
# toolchain wrapper".
#
# What outlives the story is the rule it produced. Widen this list by writing
# the tests that kill the survivors first, and only then the line: excluding the
# files that survive is choosing the scope to fit the score, and declaring the
# survivors away is a skip list wearing a ledger's clothes.
include = [
  "internal/mutation/*.go",
  "internal/glob/*.go",
  "internal/interval/*.go",
  "internal/testflag/*.go",
  "internal/operatorselect/*.go",
  "internal/drift/*.go",
  "internal/coverage/*.go",
  "internal/schemas/*.go",
  "internal/config/*.go",
  "internal/gocmd/*.go",
  "internal/report/*.go",
  "internal/testlog/*.go",
  "internal/tempowner/*.go",
  "internal/gitdiff/*.go",
  "internal/snapshot/*.go",
  "internal/cache/*.go",
  "internal/validate/*.go",
]
exclude = ["**/*_test.go", "**/testdata/**", "fixtures/**", "vendor-assets/**"]
# `operators` is intentionally omitted: the profile decides the families, which
# keeps this file honest when a new family lands. Uncomment to narrow.
# operators = ["comparison", "error-swallowing"]

# The declared equivalent mutants. An expectation is evidence to check, not a
# skip list: the row is judged on every run, survival fulfills it, a kill is
# exit 2, and an ID that no longer exists in the catalog is stale and also
# exit 2. Forty-two of the sixty-three rows are judged by a test binary that
# ran; the other twenty-one are settled by coverage without a process being
# started, and the notes there say why that is the same verdict rather than a
# weaker one.
#
# Every row was found by running this gate against this repository, and is
# declared rather than tested away or quietly excluded, which is the difference
# between a mutation score and a number.
#
# Three rows that used to stand at the head of this ledger are gone for the
# better reason. `return Disjoint`, `return OutcomeNotRun` and `return
# mutation.OutcomeNotRun` were each the first name of an iota block returned
# where `return-zero-numeric` proposes `0` -- one constant, two spellings, one
# program -- and discovery now refuses an edit whose replacement is the value
# the source already holds, whether the bytes say so or only go/types does. A
# ledger row retired by a refusal is worth three rows arguing the same sentence,
# and the argument is in docs/operators.md under "The refusals that are not
# skips" where a reader looking for it will be.

# The fifteen rows that follow are in internal/mutation: the survivors there
# that no honest test can reach. Every survivor a test could pin has a test
# instead, in that package's own suites, which is why this list is fifteen rows
# rather than the forty-one the whole-package scope reported. Each row says
# which of four things it is rather than repeating the word "equivalent" fifteen
# times, because a ledger that argues the same sentence over and over is the
# skip list this file refuses to keep.
#
# Every one of these ids names a mutant the include list above covers, so all
# fifteen are catalogued and judged on every run of this gate rather than taken
# on trust: survival is what fulfills a row, a kill is exit 2, and an id the
# catalogue no longer holds is stale and exit 2 as well. Ten of them survive a
# test binary that ran. The other five are reported `survived (uncovered)`
# without a process being started, because no binary in this scope reaches the
# line at all -- which is coverage saying, from a cheaper direction, exactly
# what those five reasons argue: an unreachable branch and four error paths
# behind a math.MaxUint32 guard are not lines a suite reaches.

# Equivalent by construction: a comparison the surrounding branch has already
# decided, or a named constant that is its type's zero value.

# The seventy-five rows below were re-issued when this repository became a
# workspace, and only their ids moved.
#
# A mutant's identity is minted in a domain, and a workspace is a different one:
# the same comparison on the same line of the same file is a different id once
# the tree holds a go.work, which is ADR 0012's "two products, two ledgers" seen
# from the inside. Every row's reason is untouched, because a reason is about
# the code and not about the run that measured it.
#
# The mapping was taken rather than guessed. main's catalogue was regenerated,
# every old id resolved there to (path, line, column, rule, original), and each
# of those coordinates found exactly one survivor in the workspace run --
# seventy-five for seventy-five, with none left over on either side. A row that
# failed to map would be a row whose survivor is gone, which is a deletion
# somebody makes on purpose rather than a rename to apply.

[[mutation.expect]]
id = "955ef7519b8fd9e564bf20a0e8c11f7b899298708405716e59b20b7fd50c680f"
reason = "Equivalent: Len returns 0 through the guard for a reversed span and EndByte - StartByte otherwise, and that difference is 0 exactly when the bounds are equal, so `<` and `<=` report the same length for every span."

[[mutation.expect]]
id = "a36a082afb5fca17a6bb2cf7c01fe2e8b453981e3b3510ae210a1ea45e7e43b4"
reason = "Equivalent: the comparison sits inside `case s.StartByte != other.StartByte`, where the two start bytes are already known to differ, so `<` and `<=` are the same test."

[[mutation.expect]]
id = "b63d62e41a5d70323435d0afca6657cf9944e117196607b3120ddf74dbf399c4"
reason = "Equivalent: the comparison sits inside `case s.EndByte != other.EndByte`, where the two end bytes are already known to differ, so `<` and `<=` are the same test."

[[mutation.expect]]
id = "d5ba43b8ceeec3f48f3b5262604413739e76abeb5feecb5bc7b1a8c5791758a2"
