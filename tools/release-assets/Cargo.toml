# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "release-assets"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"
description = "Verified draft asset reconciliation for go-mutants"
repository = "https://github.com/P4suta/go-mutants"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
hex = "0.4.3"

[dev-dependencies]
serde-saphyr = "1.1.0"
uuid = { version = "1.18", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
