[files]
extend-exclude = [
  "bin",
  "dist",
  "fixtures",
  "go.sum",
  # A recording of what the dashboard draws, and the dashboard truncates to the
  # terminal's width -- so it holds half-words on purpose. "validatin" in a
  # frame eighty columns wide is the layout working, not a misspelling, and a
  # spell checker cannot be told the difference. The words themselves are
  # checked where they are written, in internal/engine's event details.
  "internal/tui/testdata/frames.golden.txt",
  "LICENSE-*",
  "LICENSES",
  "reports/mutation",
  "vendor-assets",
]

[default.extend-words]
# Go spelling that the dictionary would otherwise correct.
iota = "iota"
# Deliberate non-word in the glob contract table ("a*b*c" must not match "abd").
abd = "abd"

[default.extend-identifiers]
# Go toolchain and standard-library identifiers used verbatim in docs.
covdata = "covdata"
gocoverdir = "gocoverdir"
