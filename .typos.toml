[files]
extend-exclude = [
  "bin",
  "dist",
  "fixtures",
  "go.sum",
  "internal/tui/testdata/frames.golden.txt",
  "LICENSE-*",
  "LICENSES",
  "reports/mutation",
  "vendor-assets",
