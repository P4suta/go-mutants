# Commit-message policy enforced by `committed` (the lefthook commit-msg hook
# and the CI lint job). Aim for subjects of at most 72 characters; 80 is the
# hard ceiling. Conventional-commit prefixes are not required here, but they
# are the house habit, so lowercase `type:` subjects must pass.
subject_length = 80
subject_capitalized = false
line_length = 100
style = "none"
merge_commit = false
