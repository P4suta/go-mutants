# SPDX-FileCopyrightText: 2026 go-mutants contributors
# SPDX-License-Identifier: MIT OR Apache-2.0

# Licensing for the files that cannot carry an inline SPDX header: the
# machine-rewritten module files (the Go tool would drop or move a comment),
# the published JSON schemas (JSON has no comment syntax at all), and the
# verbatim license texts.

version = 1

[[annotations]]
path = ["go.mod", "go.sum"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 go-mutants contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The first-party schemas in schema/. A vendored third-party schema arrives
# with its own license and gets its own entry rather than joining this one.
[[annotations]]
path = ["schema/catalog-v1.schema.json", "schema/run-report-v1.schema.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 go-mutants contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Golden JSON fixtures. Every other golden file in the repository carries an
# inline header, because every other one is Go source; these are documents in a
# format with no comment syntax, and they are generated byte-for-byte from the
# code beside them, so a header could not survive a regeneration either.
[[annotations]]
path = [
  "internal/report/testdata/run-report.golden.json",
  "internal/report/testdata/run-report-coverage.golden.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 go-mutants contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["LICENSE-MIT", "LICENSES/MIT.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 go-mutants contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["LICENSE-APACHE", "LICENSES/Apache-2.0.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"
